              label: Button Text
              type: string
            - name: button_url
              label: Button URL
              type: string
    - name: filter_section
      label: Embedded Filters Section
      type: object
      fields:
      - name: heading
        label: Title Before Embedded Filter Code
        type: string
      - name: subheading
        label: Subtitle
        type: text
      - name: enabled
        label: Show Filter Section
        type: boolean
      - name: content_width
        label: Content Width
        type: select
        options:
          values:
          - small
          - medium
          - large
          labels:
          - Small
          - Medium
          - Large
      - name: content_height
        label: Content Height
        type: select
        options:
          values:
          - compact
          - standard
          - tall
          labels:
          - Compact
          - Standard
          - Tall
      - name: content_line_height
