
media:
  input: images
  output: /images

content:
  - name: pages
    label: Website Pages
    type: collection
    path: content/pages
    format: yaml
    filename: "{primary}.yml"
    subfolders: false
    fields:
      - name: title
        label: Page Title
        type: string
        required: true

      - name: slug
        label: URL Slug
        type: string
        required: true

      - name: description
        label: Page Description
        type: text

      - name: hero_image
        label: Hero Image
        type: image

      - name: body
        label: Page Content
        type: rich-text

      - name: seo
        label: SEO Settings
        type: object
        fields:
          - name: title
            label: SEO Title
            type: string
          - name: description
            label: Meta Description
            type: text

  - name: posts
    label: Blog Articles
    type: collection
    path: content/posts
    format: yaml
    filename: "{primary}.yml"
    subfolders: false
    fields:
      - name: title
        label: Article Title
        type: string
        required: true

      - name: slug
        label: URL Slug
        type: string
        required: true

      - name: date
        label: Publication Date
        type: date

      - name: excerpt
        label: Article Excerpt
        type: text

      - name: featured_image
        label: Featured Image
        type: image

      - name: body
        label: Article Content
        type: rich-text

      - name: seo
        label: SEO Settings
        type: object
        fields:
          - name: title
            label: SEO Title
            type: string
          - name: description
            label: Meta Description
            type: text

  - name: settings
    label: Site Settings
    type: file
    path: content/settings.yml
    format: yaml
    fields:
      - name: site_name
        label: Site Name
        type: string
      - name: tagline
        label: Tagline
        type: string
      - name: logo
        label: Desktop and Site Logo
        type: image
      - name: favicon
        label: Favicon
        type: image

      - name: desktop_nav
        label: Desktop Navigation
        type: object
        fields:
          - name: links
            label: Desktop Menu Links
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label}"
            fields:
              - name: label
                label: Link Text
                type: string
              - name: url
                label: Link URL
                type: string
              - name: visible
                label: Show This Link
                type: boolean
              - name: submenu
                label: Optional Dropdown Items
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{label}"
                fields:
                  - name: label
                    label: Submenu Link Text
                    type: string
                  - name: url
                    label: Submenu Link URL
                    type: string

      - name: mobile_nav
        label: Mobile Navigation Drawer
        type: object
        fields:
          - name: logo
            label: Mobile Drawer Logo
            type: image
          - name: heading
            label: Mobile Drawer Heading
            type: string
          - name: links
            label: Mobile Menu Links
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label}"
            fields:
              - name: label
                label: Link Text
                type: string
              - name: url
                label: Link URL
                type: string
              - name: visible
                label: Show This Link
                type: boolean
              - name: submenu
                label: Optional Expandable Submenu
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{label}"
                fields:
                  - name: label
                    label: Submenu Link Text
                    type: string
                  - name: url
                    label: Submenu Link URL
                    type: string
          - name: enable_submenus
            label: Enable Mobile Expandable Submenus
            type: boolean
          - name: cta_label
            label: Mobile Button Text
            type: string
          - name: cta_url
            label: Mobile Button URL
            type: string

      - name: contact_email
        label: Contact Email
        type: string

      - name: social_links
        label: Social Links
        type: object
        fields:
          - name: facebook
            label: Facebook
            type: string
          - name: instagram
            label: Instagram
            type: string
          - name: pinterest
            label: Pinterest
            type: string
          - name: youtube
            label: YouTube
            type: string

      - name: seo
        label: Default SEO
        type: object
        fields:
          - name: title
            label: Default SEO Title
            type: string
          - name: description
            label: Default Meta Description
            type: text
