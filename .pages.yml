- name: posts
  label: Blog Articles
  type: collection
  path: content/posts
  format: yaml
  filename: '{primary}.yml'
  subfolders: false
  fields:
  - name: title
    label: Article Title
    type: string
    required: true
  - name: slug
    label: URL Slug
    type: string
    required: true
  - name: date
    label: Publication Date
    type: date
  - name: excerpt
    label: Article Excerpt
    type: text
  - name: featured_image
    label: Featured Image
    type: image
  - name: body
    label: Article Content
    type: rich-text
  - name: seo
    label: SEO Settings
    type: object
    fields:
    - name: title
      label: SEO Title
      type: string
    - name: description
      label: Meta Description
      type: text
- name: settings
  label: Site Settings
  type: file
  path: content/settings.yml
  format: yaml
  fields:
  - name: site_name
    label: Site Name
    type: string
  - name: tagline
    label: Tagline
    type: string
  - name: logo
    label: Desktop and Site Logo
    type: image
  - name: favicon
    label: Favicon
    type: image
  - name: desktop_nav
    label: Desktop Navigation
    type: object
    fields:
    - name: links
      label: Desktop Menu Links
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{label}'
      fields:
      - name: label
        label: Link Text
        type: string
      - name: url
        label: Link URL
        type: string
      - name: visible
        label: Show This Link
        type: boolean
      - name: submenu
        label: Optional Dropdown Items
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{label}'
        fields:
        - name: label
          label: Submenu Link Text
          type: string
        - name: url
          label: Submenu Link URL
          type: string
    - name: enable_submenus
      label: Enable Mobile Expandable Submenus
      type: boolean
    - name: cta_label
      label: Mobile Button Text
      type: string
    - name: cta_url
      label: Mobile Button URL
      type: string
    - name: menu_layout
      label: Menu Layout
      type: select
      options:
        values:
        - horizontal_dropdown
        - icon_buttons
        labels:
        - Horizontal menu with dropdowns
        - Icon buttons
    - name: show_currency_button
      label: Show Currency Button
      type: boolean
    - name: show_language_button
      label: Show Language Button
      type: boolean
  - name: mobile_nav
    label: Mobile Navigation
    type: object
    fields:
    - name: logo
      label: Mobile Logo
      type: image
    - name: heading
      label: Drawer Heading
      type: string
    - name: enable_submenus
      label: Enable Expandable Submenus
      type: boolean
    - name: cta_label
      label: Mobile Button Text
      type: string
    - name: cta_url
      label: Mobile Button URL
      type: string
  - name: sticky_navbar
    label: Sticky Top Navbar
    type: boolean
    description: On keeps the header visible while scrolling; Off lets it scroll away.
  - name: desktop_nav_style
    label: Desktop Navigation Style
    type: select
    options:
      values:
      - horizontal_dropdown
      - icon_buttons
      labels:
      - Horizontal menu with dropdowns
      - Icon buttons
  - name: desktop_nav_icons
    label: Desktop Utility Icon Buttons
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{label}'
    fields:
    - name: label
      label: Button Label
      type: string
    - name: icon
      label: Uploaded Icon
      type: image
    - name: action
      label: Action
      type: select
      options:
        values:
        - language
        - currency
        - link
        labels:
        - Change language
        - Switch currency (filter currency selector)
        - Open link
    - name: url
      label: URL (for Open link)
      type: string
    - name: visible
      label: Show Button
      type: boolean
  - name: language_options
    label: Available Languages
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{label}'
    fields:
    - name: label
      label: Language Name
      type: string
    - name: code
      label: Language Code
      type: string
  - name: global_styles
    label: Global Styles
    type: object
    fields:
    - name: primary_color
      label: Primary Colour
      type: string
      description: 'Enter a hex colour, e.g. #0042FF.'
    - name: secondary_color
      label: Secondary Colour
      type: string
    - name: heading_font
      label: Heading Font
      type: select
      options:
        values:
        - Playfair Display
        - Lexend
        - Arial
        - Georgia
        labels:
        - Playfair Display
        - Lexend
        - Arial
        - Georgia
    - name: heading_color
      label: Heading Colour
      type: string
    - name: heading_size
      label: Heading Size (CSS value)
      type: string
    - name: heading_letter_spacing
      label: Heading Letter Spacing (CSS value)
      type: string
    - name: subheading_font
      label: Subheading Font
      type: select
      options:
        values:
        - Lexend
        - Playfair Display
        - Arial
        - Georgia
        labels:
        - Lexend
        - Playfair Display
        - Arial
        - Georgia
    - name: subheading_color
      label: Subheading Colour
      type: string
    - name: subheading_size
      label: Subheading Size (CSS value)
      type: string
    - name: subheading_letter_spacing
      label: Subheading Letter Spacing (CSS value)
      type: string
    - name: body_font
      label: Body Font
      type: select
      options:
        values:
        - Lexend
        - Arial
        - Georgia
        - Playfair Display
        labels:
        - Lexend
        - Arial
        - Georgia
        - Playfair Display
    - name: body_color
      label: Body Text Colour
      type: string
    - name: body_size
      label: Body Text Size (CSS value)
      type: string
    - name: body_letter_spacing
      label: Body Letter Spacing (CSS value)
      type: string
  - name: cookie_popup
    label: Homepage Cookie Popup
    type: object
    fields:
    - name: enabled
      label: Show Cookie Popup
      type: boolean
    - name: title
      label: Popup Title
      type: string
    - name: message
      label: Popup Message
      type: text
    - name: accept_label
      label: Accept Button Text
      type: string
    - name: reject_label
      label: Reject Button Text
      type: string
    - name: settings_label
      label: Settings Button Text
      type: string
    - name: position
      label: Popup Position
      type: select
      options:
        values:
        - bottom-left
        - bottom-center
        - bottom-right
        labels:
        - Bottom left
        - Bottom centre
        - Bottom right
    - name: background_color
      label: Popup Background Colour
      type: string
    - name: text_color
      label: Popup Text Colour
      type: string
    - name: button_color
      label: Accept Button Colour
      type: string
    - name: privacy_url
      label: Privacy Policy URL
      type: string
    - name: remember_choice
      label: Remember Visitor Choice
      type: boolean
  - name: contact_email
    label: Contact Email
    type: string
  - name: social_links
    label: Social Links
    type: object
    fields:
    - name: facebook
      label: Facebook
      type: string
    - name: instagram
      label: Instagram
      type: string
    - name: pinterest
      label: Pinterest
      type: string
    - name: youtube
      label: YouTube
      type: string
  - name: footer
    label: Footer
    type: object
    fields:
    - name: background_color
      label: Footer Background Colour
      type: string
    - name: text_color
      label: Footer Text Colour
      type: string
    - name: alignment
      label: Footer Alignment (left, center, right)
      type: string
    - name: copyright
      label: Copyright Text
