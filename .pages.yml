media:
  input: images
  output: /images

content:
  - name: pages
    label: Website Pages
    type: collection
    path: content/pages
    format: yaml
    filename: "{primary}.yml"
    subfolders: false
    fields:
      - name: title
        label: Page Title
        type: string
        required: true
      - name: slug
        label: URL Slug
        type: string
        required: true
      - name: description
        label: Page Description
        type: text
      - name: hero_image
        label: Hero Image
        type: image
      - name: body
        label: Page Content
        type: rich-text

      - name: homepage_design
        label: Homepage Design
        type: object
        fields:
          - name: hero
            label: First Screen / Hero
            type: object
            fields:
              - name: heading
                label: Hero Heading
                type: string
              - name: subheading
                label: Hero Subheading
                type: text
              - name: subheading_uppercase
                label: Make Hero Subheading Uppercase
                type: boolean
              - name: subheading_font_size
                label: Hero Subheading Font Size (CSS value, e.g. 20px)
                type: string
              - name: heading_line_height
                label: Hero Heading Line Height (e.g. 1.1)
                type: string
              - name: subheading_line_height
                label: Hero Subheading Line Height (e.g. 1.35)
                type: string
              - name: content_padding_top
                label: Hero Text Area Top Padding (e.g. 12px)
                type: string
              - name: content_padding_bottom
                label: Hero Text Area Bottom Padding (e.g. 12px)
                type: string
              - name: button_label
                label: Browse Button Text
                type: string
              - name: button_url
                label: Browse Button URL
                type: string
              - name: button_height
                label: Browse Button Height (e.g. 38px)
                type: string
              - name: background_color
                label: Hero Background Colour
                type: string
              - name: background_image
                label: Hero Background Image
                type: image

          - name: slider
            label: Homepage Slider
            type: object
            fields:
              - name: enabled
                label: Show Slider
                type: boolean
              - name: autoplay
                label: Autoplay On / Off
                type: boolean
              - name: autoplay_seconds
                label: Autoplay Interval in Seconds
                type: number
              - name: height_mobile
                label: Slider Height on Mobile (e.g. 190px)
                type: string
              - name: height_desktop
                label: Slider Height on Desktop (e.g. 300px)
                type: string
              - name: heading_line_height
                label: Slider Heading Line Height (e.g. 1.05)
                type: string
              - name: subheading_line_height
                label: Slider Subheading Line Height (e.g. 1.3)
                type: string
              - name: subheading_uppercase
                label: Make Slider Subheading Uppercase
                type: boolean
              - name: subheading_font_size
                label: Slider Subheading Font Size (CSS value, e.g. 15px)
                type: string
              - name: text_padding_top
                label: Text Area Top Padding (e.g. 12px)
                type: string
              - name: text_padding_bottom
                label: Text Area Bottom Padding (e.g. 12px)
                type: string
              - name: slides
                label: Slider Slides
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{heading}"
                fields:
                  - name: heading
                    label: Slide Heading
                    type: string
                  - name: subheading
                    label: Slide Subheading
                    type: text
                  - name: subheading_uppercase
                    label: Uppercase Subheading
                    type: boolean
                  - name: background_image
                    label: Slide Background Image
                    type: image
                  - name: background_color
                    label: Slide Background Colour
                    type: string
                  - name: text_alignment
                    label: Text Alignment (left, center, right)
                    type: string
                  - name: heading_line_height
                    label: Heading Line Height (e.g. 1.05)
                    type: string
                  - name: subheading_line_height
                    label: Subheading Line Height (e.g. 1.3)
                    type: string
                  - name: button_label
                    label: Button Text (optional)
                    type: string
                  - name: button_url
                    label: Button URL (optional)
                    type: string

          - name: features
            label: Feature / List Section
            type: object
            fields:
              - name: heading
                label: Section Heading
                type: string
              - name: subheading
                label: Section Subheading
                type: text
              - name: layout
                label: Card Layout (centered or side-by-side)
                type: string
              - name: background_color
                label: Section Background Colour
                type: string
              - name: background_image
                label: Section Background Image
                type: image
              - name: heading_line_height
                label: Section Heading Line Height
                type: string
              - name: subheading_line_height
                label: Section Subheading Line Height
                type: string
              - name: body_line_height
                label: Card Description Line Height
                type: string
              - name: items
                label: Feature Items
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{heading}"
                fields:
                  - name: icon
                    label: Icon Image
                    type: image
                  - name: heading
                    label: Item Heading
                    type: string
                  - name: subheading
                    label: Item Subheading / Description
                    type: text
                  - name: layout
                    label: This Item Layout (centered or side-by-side)
                    type: string
                  - name: background_color
                    label: Item Background Colour
                    type: string
                  - name: background_image
                    label: Item Background Image
                    type: image
                  - name: button_label
                    label: Optional Button Text
                    type: string
                  - name: button_url
                    label: Optional Button URL
                    type: string

          - name: faq
            label: FAQ Section
            type: object
            fields:
              - name: heading
                label: FAQ Heading
                type: string
              - name: background_color
                label: FAQ Background Colour
                type: string
              - name: background_image
                label: FAQ Background Image
                type: image
              - name: text_color
                label: FAQ Text Colour
                type: string
              - name: answer_line_height
                label: Answer Line Height
                type: string
              - name: default_open
                label: Open Answers by Default
                type: boolean
              - name: view_all_label
                label: View All FAQs Button Text
                type: string
              - name: view_all_url
                label: View All FAQs Button URL
                type: string
              - name: items
                label: Questions and Answers
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{question}"
                fields:
                  - name: question
                    label: Question
                    type: string
                  - name: answer
                    label: Answer
                    type: rich-text

      - name: seo
        label: SEO Settings
        type: object
        fields:
          - name: title
            label: SEO Title
            type: string
          - name: description
            label: Meta Description
            type: text

  - name: posts
    label: Blog Articles
    type: collection
    path: content/posts
    format: yaml
    filename: "{primary}.yml"
    subfolders: false
    fields:
      - name: title
        label: Article Title
        type: string
        required: true
      - name: slug
        label: URL Slug
        type: string
        required: true
      - name: date
        label: Publication Date
        type: date
      - name: excerpt
        label: Article Excerpt
        type: text
      - name: featured_image
        label: Featured Image
        type: image
      - name: body
        label: Article Content
        type: rich-text
      - name: seo
        label: SEO Settings
        type: object
        fields:
          - name: title
            label: SEO Title
            type: string
          - name: description
            label: Meta Description
            type: text

  - name: settings
    label: Site Settings
    type: file
    path: content/settings.yml
    format: yaml
    fields:
      - name: site_name
        label: Site Name
        type: string
      - name: tagline
        label: Tagline
        type: string
      - name: logo
        label: Desktop and Site Logo
        type: image
      - name: favicon
        label: Favicon
        type: image
      - name: desktop_nav
        label: Desktop Navigation
        type: object
        fields:
          - name: links
            label: Desktop Menu Links
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label}"
            fields:
              - name: label
                label: Link Text
                type: string
              - name: url
                label: Link URL
                type: string
              - name: visible
                label: Show This Link
                type: boolean
              - name: submenu
                label: Optional Dropdown Items
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{label}"
                fields:
                  - name: label
                    label: Submenu Link Text
                    type: string
                  - name: url
                    label: Submenu Link URL
                    type: string
          - name: enable_submenus
            label: Enable Mobile Expandable Submenus
            type: boolean
          - name: cta_label
            label: Mobile Button Text
            type: string
          - name: cta_url
            label: Mobile Button URL
            type: string
      - name: mobile_nav
        label: Mobile Navigation
        type: object
        fields:
          - name: logo
            label: Mobile Logo
            type: image
          - name: heading
            label: Drawer Heading
            type: string
          - name: enable_submenus
            label: Enable Expandable Submenus
            type: boolean
          - name: cta_label
            label: Mobile Button Text
            type: string
          - name: cta_url
            label: Mobile Button URL
            type: string
      - name: contact_email
        label: Contact Email
        type: string
      - name: social_links
        label: Social Links
        type: object
        fields:
          - name: facebook
            label: Facebook
            type: string
          - name: instagram
            label: Instagram
            type: string
          - name: pinterest
            label: Pinterest
            type: string
          - name: youtube
            label: YouTube
            type: string
      - name: footer
        label: Footer
        type: object
        fields:
          - name: background_color
            label: Footer Background Colour
            type: string
          - name: text_color
            label: Footer Text Colour
            type: string
          - name: alignment
            label: Footer Alignment (left, center, right)
            type: string
          - name: copyright
            label: Copyright Text
            type: string
          - name: columns
            label: Footer Columns
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{heading}"
            fields:
              - name: heading
                label: Column Heading
                type: string
              - name: links
                label: Column Links
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{label}"
                fields:
                  - name: label
                    label: Link Text
                    type: string
                  - name: url
                    label: Link URL
                    type: string
      - name: seo
        label: Default SEO
        type: object
        fields:
          - name: title
            label: Default SEO Title
            type: string
          - name: description
            label: Default Meta Description
            type: text
