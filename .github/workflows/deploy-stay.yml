
name: Deploy Stay Website

on:
  push:
    branches:
      - main
    paths:
      - 'stay/**'
      - '.github/workflows/deploy-stay.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare Stay website
        run: |
          mkdir -p public
          cp -r stay/. public/
          cp -r images public/images

      - name: Upload Stay website
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
