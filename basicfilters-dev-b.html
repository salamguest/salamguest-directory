<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SalamGuest Directory</title>

<link href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:wght@700&family=Lexend:wght@400;500&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:Lexend,sans-serif;
background:#fff;
overflow-x:hidden;
}

.container{
display:flex;
gap:20px;
padding:20px;
max-width:1400px;
margin:auto;
}

.sidebar{width:260px;}

.main{flex:1;}

/* SEARCH */
.search{
position:relative;
margin-bottom:10px;
}

.search input{
width:100%;
padding:12px 50px 12px 14px;
border-radius:12px;
border:1px solid #ddd;
}

.searchBtn{
position:absolute;
right:8px;
top:50%;
transform:translateY(-50%);
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
}

/* CARD */
.card{
background:#fff;
border-radius:14px;
box-shadow:0 3px 10px rgba(0,0,0,0.12);
overflow:hidden;
}

/* TOP BUTTONS */
.topButtons{
display:flex;
gap:10px;
margin:10px 0;
}

/* =========================
BFSB FIX (IMPORTANT)
========================= */

#bfsbWrapper{
position:sticky;
bottom:10px;
z-index:999999;
}

#bottomFilterBar{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;

padding:12px;
margin:0 12px;

background:rgba(255,255,255,0.95);
backdrop-filter:blur(12px);
border-radius:18px;
box-shadow:0 8px 25px rgba(0,0,0,0.12);
}

/* MOBILE ONLY */
@media(min-width:901px){
#bfsbWrapper{display:none;}
}
    
  </style>

</head>

<body>

<div class="container">

  <!-- SIDEBAR -->
  <div class="sidebar">

    <div id="loadingFilters">LOADING FILTERS</div>
    <div id="filters"></div>

  </div>

  <!-- MAIN -->
  <div class="main">

    <!-- SEARCH -->
    <div class="search">
      <input id="searchInput" placeholder="Search hotel, stay or keyword">

      <button class="searchBtn" onclick="runStickySearch()">
        🔍
      </button>
    </div>

    <!-- TOP BUTTONS -->
    <div class="topButtons">
      <button class="clearBtn" onclick="clearAll()">Clear</button>

      <select id="sortSelect" onchange="render()">
        <option value="default">Sort</option>
        <option value="lowHigh">Price Low</option>
        <option value="highLow">Price High</option>
        <option value="ratingHigh">Top Rated</option>
      </select>

      <button class="currencyTopBtn" onclick="openCurrencyPopup(event)">
        MYR ▼
      </button>
    </div>

    <div id="noResults">No results found</div>

    <!-- CARDS -->
    <div class="grid" id="cards"></div>

    <!-- PAGINATION -->
    <div class="bottomNav">
      <button onclick="scrollTopSmooth()">Back To Top</button>
      <div id="pagination"></div>
    </div>

  </div>
</div>

<!-- BFSB (IMPORTANT FIXED WRAPPER) -->
<div id="bfsbWrapper">
  <div id="bottomFilterBar">

    <div id="filterCount" onclick="scrollToFilters()">
      ⌂ FILTERS
    </div>

    <div id="floatingSearchBtn" onclick="runStickySearch()">
      SEARCH
    </div>

  </div>
</div>

<!-- OVERLAYS -->
<div id="searchOverlay">
  <div class="searchPopup">SEARCHING...</div>
</div>

<div id="redirectOverlay">
  <div class="redirectBox">
    Redirecting...
  </div>
</div>

<script>

const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSYw1Ah01StvD_FKZvGw7M_pxB8_mxLhYDwE9rT7PEmK5n7VS7mxIi0FQZ1BezpycxRhOaXzrpwyRHU/pub?gid=0&single=true&output=csv";

const ITEMS_PER_PAGE = 12;

let data = [];
let activeFilters = [];
let currentPage = 1;
let currentCurrency = "MYR";

let exchangeRates = { MYR: 1 };

/* LOAD RATES */
async function loadRates() {
  try {
    const res = await fetch("https://api.exchangerate.host/latest?base=MYR");
    const json = await res.json();

    exchangeRates = {
      MYR: 1,
      USD: json.rates.USD,
      SGD: json.rates.SGD,
      GBP: json.rates.GBP,
      EUR: json.rates.EUR,
      JPY: json.rates.JPY,
      SAR: json.rates.SAR,
      AED: json.rates.AED
    };

  } catch {
    exchangeRates = { MYR: 1, USD: 0.21, SGD: 0.3 };
  }
}

/* CSV PARSER */
function parseCSV(text) {
  const rows = text.split("\n").map(r => r.split(","));
  const headers = rows[0];

  return rows.slice(1).map(row => {
    let obj = {};
    headers.forEach((h, i) => obj[h.trim()] = (row[i] || "").trim());
    return obj;
  });
}

/* PRICE */
function formatPrice(price) {
  return ((parseFloat(price) || 0) * exchangeRates[currentCurrency]).toFixed(2);
}

/* LOAD DATA */
async function load() {
  await loadRates();

  const res = await fetch(SHEET_URL);
  const text = await res.text();

  data = parseCSV(text);

  buildFilters();
  render();
}

/* FILTERS */
function buildFilters() {
  const container = document.getElementById("filters");

  const groups = {};

  data.forEach(item => {
    (item.filter_tags || "").split(",").forEach(tag => {
      if (!tag.includes(":")) return;

      let [cat, val] = tag.split(":");
      if (!groups[cat]) groups[cat] = new Set();
      groups[cat].add(val.trim());
    });
  });

  container.innerHTML = "";

  Object.keys(groups).forEach(cat => {

    let block = document.createElement("div");
    block.innerHTML = `<div class="filterTitle">${cat}</div>`;

    groups[cat].forEach(val => {
      let el = document.createElement("div");
      el.className = "tag";
      el.innerText = val;

      el.onclick = () => toggle(cat + ":" + val, el);

      block.appendChild(el);
    });

    container.appendChild(block);
  });
}

/* TOGGLE */
function toggle(tag, el) {
  if (activeFilters.includes(tag)) {
    activeFilters = activeFilters.filter(t => t !== tag);
    el.classList.remove("active");
  } else {
    activeFilters.push(tag);
    el.classList.add("active");
  }

  currentPage = 1;
  render();
}

/* RENDER */
function render() {

  const search = document.getElementById("searchInput").value.toLowerCase();

  let filtered = data.filter(item => {

    let tags = (item.filter_tags || "").toLowerCase();

    let matchFilters = activeFilters.every(f =>
      tags.includes(f.toLowerCase())
    );

    let text =
      (item.name + item.description + item.city + item.country).toLowerCase();

    let matchSearch = text.includes(search);

    return matchFilters && matchSearch;
  });

  if (filtered.length === 0) {
    document.getElementById("noResults").style.display = "block";
  } else {
    document.getElementById("noResults").style.display = "none";
  }

  const start = (currentPage - 1) * ITEMS_PER_PAGE;
  const pageData = filtered.slice(start, start + ITEMS_PER_PAGE);

  document.getElementById("cards").innerHTML = pageData.map(item => `
    <div class="card">
      <div class="carouselWrap">
        <img src="https://salamguest.github.io/salamguest-directory/images/${item.media}/1.jpg">
      </div>

      <div class="cardBody">
        <div class="title">${item.name}</div>
        <div class="location">${item.city}, ${item.country}</div>
        <div class="description">${item.description}</div>

        <div class="priceAmount">${formatPrice(item.price)}</div>
      </div>
    </div>
  `).join("");

  renderPagination(filtered.length);
  updateStickyBar();
  sendHeight();
}

/* PAGINATION */
function renderPagination(total) {
  const pages = Math.ceil(total / ITEMS_PER_PAGE);

  document.getElementById("pagination").innerHTML =
    Array.from({ length: pages }, (_, i) => `
      <button class="pageBtn ${i + 1 === currentPage ? "active" : ""}"
        onclick="goPage(${i + 1})">${i + 1}</button>
    `).join("");
}

function goPage(p) {
  currentPage = p;
  render();
}

/* CLEAR */
function clearAll() {
  activeFilters = [];
  currentPage = 1;
  document.querySelectorAll(".tag").forEach(t => t.classList.remove("active"));
  document.getElementById("searchInput").value = "";
  render();
}

/* STICKY BAR */
function updateStickyBar() {
  const bar = document.getElementById("bottomFilterBar");
  if (!bar) return;

  if (window.innerWidth > 900) {
    bar.style.display = "none";
    return;
  }

  bar.style.display = "flex";

  document.getElementById("filterCount").innerText =
    activeFilters.length > 0
      ? `FILTERS • ${activeFilters.length} SELECTED`
      : `FILTERS`;
}

/* SEARCH BUTTON */
function runStickySearch() {
  document.getElementById("searchOverlay").style.display = "flex";

  setTimeout(() => {
    render();
    document.getElementById("searchOverlay").style.display = "none";
    window.scrollTo({ top: 0, behavior: "smooth" });
  }, 600);
}

/* HEIGHT FIX (PAYHIP) */
function sendHeight() {
  window.parent.postMessage({
    type: "SET_IFRAME_HEIGHT",
    height: document.body.scrollHeight
  }, "*");
}

/* INIT */
load();
</script>

</body>
</html>
