<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SalamGuest Directory</title>

<link href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:wght@700&family=Lexend:wght@400;500&display=swap" rel="stylesheet">

<style>

/* =========================
CRITICAL FIX: SINGLE SCROLL LAYER
========================= */

html, body {
  height: 100%;
  margin: 0;
  padding: 0;

  /* IMPORTANT: prevents iframe inner scroll stacking */
  overflow-x: hidden;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

/* prevent any inner scroll containers from creating second scroll */
* {
  box-sizing: border-box;
}

/* REMOVE any accidental scroll areas */
.carousel,
.carouselWrap {
  overflow-x: auto;
  overflow-y: hidden;
}

/* =========================
BASE
========================= */

body{
margin:0;
font-family:Lexend,sans-serif;
background:#fff;
color:#222;
}

.container{
display:flex;
align-items:flex-start;
gap:20px;
padding:20px;
max-width:1400px;
margin:0 auto;
}

/* =========================
SIDEBAR
========================= */

.sidebar{
width:260px;
flex-shrink:0;
}

#filters{
max-height:none !important;
overflow:visible !important;
}

/* =========================
SEARCH
========================= */

.search{
position:relative;
}

.search input{
width:100%;
padding:12px 52px 12px 14px;
border-radius:12px;
border:1px solid #dbe4ff;
background:#eef3ff;
}

/* =========================
GRID
========================= */

.main{
flex:1;
min-width:0;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:22px;
margin-top:20px;
}

/* =========================
CARD
========================= */

.card{
background:white;
border-radius:16px;
overflow:hidden;
box-shadow:0 3px 10px rgba(0,0,0,0.14);
display:flex;
flex-direction:column;
}

/* IMPORTANT FIX: prevent nested scroll stealing touch events */
.carouselWrap{
position:relative;
overflow:hidden;
min-height:220px;
touch-action: pan-y; /* key fix for iframe double scroll */
}

.carousel{
display:flex;
overflow-x:auto;
scroll-snap-type:x mandatory;
scroll-behavior:smooth;
scrollbar-width:none;
touch-action: pan-x; /* allows horizontal only */
}

.carousel::-webkit-scrollbar{
display:none;
}

/* =========================
BACK TO TOP FIX (IMPORTANT)
========================= */

.bottomNav button{
cursor:pointer;
color:#0042FD;
font-size:14px;
background:none;
border:none;
padding:0;
}

/* THIS IS THE REAL FIX */
html {
  scroll-behavior: smooth;
}

/* =========================
PREVENT IF INNER JS SCROLL EXISTS
========================= */

* {
  overscroll-behavior: auto;
}

/* =========================
KEEP EVERYTHING ELSE SAME
========================= */

.tag{ cursor:pointer; }
.locked-chip{ cursor:pointer; }

</style>

</head>

<body>

<div class="container">

  <div class="sidebar">

    <div id="loadingFilters">LOADING FILTERS</div>
    <div id="filters"></div>

  </div>

  <div class="main">

    <div class="search">
      <input id="searchInput" placeholder="Search hotel, stay or any keyword">
    </div>

    <div id="cards" class="grid"></div>

    <div class="bottomNav">
      <button onclick="window.scrollTo({top:0, behavior:'smooth'})">
        Back To Top
      </button>
    </div>

  </div>

</div>

<script>

/* =========================
CRITICAL SCROLL FIX
========================= */

/* force ONLY document scroll */
window.addEventListener("load", () => {
  document.documentElement.style.overflow = "auto";
  document.body.style.overflow = "auto";

  // kill accidental iframe scroll trapping
  document.body.style.position = "relative";
});

/* =========================
BACK TO TOP SAFE FUNCTION
========================= */

function scrollTopSmooth(){
  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

</script>

</body>
</html>
