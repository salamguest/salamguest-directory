<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SalamGuest Directory</title>

<link href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:wght@700&family=Lexend:wght@400;500&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Lexend,sans-serif;
background:#fff;
color:#222;
overflow-x: hidden;
}

.container{
display:flex;
align-items:flex-start;
gap:20px;
padding:20px;
max-width:1400px;
margin:0 auto;
box-sizing:border-box;
}

.sidebar{
width:260px;
flex-shrink:0;
}

/* =========================
LOADING FILTERS
========================= */

#loadingFilters{
font-family:"Libre Bodoni",serif;
font-size:14px;
letter-spacing:1.8px;
text-transform:uppercase;
color:#0042FD;
margin-top: 20px;
margin-bottom:30px;
animation:softBlink 1.8s ease-in-out infinite;
}

@keyframes softBlink{
0%{opacity:0.45;}
50%{opacity:1;}
100%{opacity:0.45;}
}

.filterTitle{
font-size:14px;
font-weight:500;
margin-top:18px;
margin-bottom:8px;
color:#001A66;
}

.tag{
display:inline-flex;
align-items:center;
justify-content:center;
padding:8px 14px;
margin:4px 4px 0 0;
background:#f2f2f2;
border-radius:999px;
font-size:13px;
cursor:pointer;
transition:0.2s;
text-align:center;
color:#001A66;
}

.tag.active{
background:#0042FD;
color:#fff;
}

.main{flex:1;min-width:0;}

/* SEARCH */
.search{position:relative;}

.search input{
width:100%;
padding:12px 52px 12px 14px;
border-radius:12px;
border:1px solid #dbe4ff;
background:#eef3ff;
font-family:Lexend;
font-size:14px;
box-sizing:border-box;
box-shadow:inset 0 2px 6px rgba(0,0,0,0.08);
outline:none;
}

.searchBtn{
position:absolute;
right:8px;
top:50%;
transform:translateY(-50%);
width:36px;height:36px;
border:none;
background:#0042FD;
border-radius:999px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
padding:0;
}

.searchBtn svg{width:18px;height:18px;stroke:white;stroke-width:2.2;fill:none;}

/* TOP BUTTONS */
.topButtons{
margin-top:10px;
display:flex;
gap:10px;
flex-wrap:wrap;
align-items:center;
}

.clearBtn,.sortSelect,.currencyTopBtn{
padding:8px 14px;
border-radius:999px;
font-family:Lexend;
cursor:pointer;
}

.clearBtn{
border:2px solid #0042FD;
background:white;
color:#0042FD;
}

.sortSelect{
border:1px solid #dbe4ff;
background:#eef3ff;
font-size:13px;
color:#444;
}

.currencyTopBtn{
border:1px solid #dbe4ff;
background:#eef3ff;
color:#444;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:22px;
margin-top:20px;
}

/* CARD */
.card{
background:white;
border-radius:16px;
overflow:hidden;
box-shadow:0 3px 10px rgba(0,0,0,0.14);
display:flex;
flex-direction:column;
}

/* CAROUSEL */
.carouselWrap{position:relative;overflow:hidden;min-height:220px;background:#f5f5f5;}

.carousel{
display:flex;
overflow-x:auto;
scroll-snap-type:x mandatory;
scroll-behavior:smooth;
-ms-overflow-style:none;
scrollbar-width:none;
min-height:220px;
}

.carousel::-webkit-scrollbar{display:none;}

.carousel img{
width:100%;
height:220px;
object-fit:cover;
flex-shrink:0;
scroll-snap-align:start;
}

/* INDICATORS */
.carouselIndicators{
position:absolute;
bottom:10px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:8px;
margin-top:10px;
}

.carouselIndicators span{
width:28px;height:4px;border-radius:999px;background:#d8d8d8;
}

.carouselIndicators span.active{width:42px;background:#0042FD;}

/* CARD BODY */
.cardBody{padding:16px;display:flex;flex-direction:column;flex-grow:1;}

.title{font-family:"Libre Bodoni",serif;color:#001A66;font-size:21px;}

.location{font-size:13px;color:#666;}

.description{font-size:13px;line-height:1.6;color:#444;white-space:pre-line;}

/* PRICE */
.priceWrap{margin-top:14px;}

.priceLabel{font-family:"Libre Bodoni",serif;font-size:10px;color:#001A66;}

.priceAmount{font-family:"Libre Bodoni",serif;font-size:21px;color:#001A66;}

.priceCurrency{font-size:11px;color:#111;border-bottom:1px dotted #111;cursor:pointer;}

/* RATING */
.rating{margin-top:12px;font-size:14px;color:#0042FD;}

.ratingSmall{font-size:10px;color:#777;}

/* TAGS */
.tagsRow{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}

.cardTag{
background:#eaf0ff;
color:#0042FD;
padding:8px 12px;
border-radius:999px;
font-size:11px;
}

/* BOOK */
.book{
display:block;
margin-top:16px;
padding:12px;
text-align:center;
background:#0042FD;
color:white;
border-radius:999px;
text-decoration:none;
}

/* LOCKED CHIPS */
.locked-chip{
display:inline-flex;
align-items:center;
justify-content:center;
padding:9px 14px;
border-radius:999px;
background:#EEF1F7;
color:#b2bad1;
font-family:Lexend;
font-size:13px;
cursor:pointer;
opacity:0.82;
}

.locked-chip span{filter:blur(0.5px);}

.locked-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}

/* POPUPS */
.premiumPopup,#currencyPopup{
position:fixed;
display:none;
background:white;
border-radius:18px;
padding:18px;
width:260px;
z-index:999999;
}

</style>

</head>

<body>

<div class="container">

<div class="sidebar">

<div id="bottomFilterBar">
<div id="filterCount" onclick="scrollToFilters()">⌂ FILTERS • 0 SELECTED</div>
<div id="floatingSearchBtn" onclick="runStickySearch()">SEARCH</div>
</div>

<div id="searchInlineStatus">SEARCHING...</div>
<div id="loadingFilters">LOADING FILTERS</div>
<div id="filters"></div>

<!-- LOCKED CHIPS (SIDEBAR PREVIEW) -->
<div class="locked-grid" style="display:none;">
  <div class="locked-chip" onclick="openPremiumPopup(event)"><span>Halal Certified</span></div>
  <div class="locked-chip" onclick="openPremiumPopup(event)"><span>Mini Fridge Provided</span></div>
  <div class="locked-chip" onclick="openPremiumPopup(event)"><span>Prayer Room Nearby</span></div>
  <div class="locked-chip" onclick="openPremiumPopup(event)"><span>Family Friendly</span></div>
</div>

</div>

<div class="main">

<div class="search">
<input id="searchInput" placeholder="Search hotel, stay or any keyword">
<button class="searchBtn" onclick="runStickySearch()">🔍</button>
</div>

<div class="topButtons">
<button class="clearBtn" onclick="clearAll()">Clear All</button>
<select id="sortSelect" class="sortSelect" onchange="render()">
<option value="default">Sort</option>
<option value="lowHigh">Price: Low to High</option>
<option value="highLow">Price: High to Low</option>
<option value="ratingHigh">Highest Rated</option>
<option value="ratingLow">Lowest Rated</option>
</select>
<button class="currencyTopBtn" onclick="openCurrencyPopup(event)">MYR ▼</button>
</div>

<div id="noResults">No results found.</div>
<div class="grid" id="cards"></div>

<div class="bottomNav">
<button onclick="scrollTopSmooth()">Back To Top</button>
<div id="pagination"></div>
</div>

</div>
</div>

<div id="redirectOverlay"></div>

<div id="premiumPopup" class="premiumPopup"></div>
<div id="currencyPopup"></div>

<script>
/* FULL JS KEPT EXACTLY AS YOUR ORIGINAL */
</script>

<div id="searchOverlay">
<div class="searchPopup">
<div id="searchStatusText">SEARCHING</div>
</div>
</div>

</body>
</html>
