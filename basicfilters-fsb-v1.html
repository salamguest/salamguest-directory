/* CSV */

function parseCSV(text){

const rows = [];
let row = [];
let current = "";
let inQuotes = false;

for(let i = 0; i < text.length; i++){

const char = text[i];
const next = text[i + 1];

if(char === '"'){

if(inQuotes && next === '"'){
current += '"';
i++;
}else{
inQuotes = !inQuotes;
}

}else if(char === "," && !inQuotes){

row.push(current);
current = "";

}else if((char === "\n" || char === "\r") && !inQuotes){

if(current || row.length){
row.push(current);
rows.push(row);
row = [];
current = "";
}

}else{

current += char;

}

}

if(current || row.length){
row.push(current);
rows.push(row);
}

const headers = rows[0].map(h => h.trim());

return rows.slice(1).map(cols => {

let obj = {};

headers.forEach((h,i)=>{
obj[h] = (cols[i] || "").trim();
});

return obj;

});

}

":"

/* Premium Popup */

function openPremiumPopup(event){

const popup =
document.getElementById("premiumPopup");

popup.style.display = "block";

popup.style.position = "absolute";

/* popup width */
const popupWidth = 270;
const padding = 14;

/* screen width */
const screenWidth = window.innerWidth;

/* click position */
let x = event.pageX;
let y = event.pageY;

/* default position */
let left = x;
let top = y + 10;

/* prevent overflow right */
if(left + popupWidth > screenWidth){

left = screenWidth - popupWidth - padding;

}

/* never too left */
if(left < padding){

left = padding;

}

popup.style.left = left + "px";
popup.style.top = top + "px";

}

function closePremiumPopup(){

document.getElementById("premiumPopup")
.style.display = "none";

}

/* close clicking outside */
document.addEventListener("click", function(e){

/* PREMIUM POPUP */

const premium =
document.getElementById("premiumPopup");

if(
premium &&
!premium.contains(e.target)
&&
!e.target.closest(".locked-chip")
){

premium.style.display = "none";

}

/* CURRENCY POPUP */

const currency =
document.getElementById("currencyPopup");

if(
currency &&
!currency.contains(e.target)
&&
!e.target.closest(".currencyTopBtn")
&&
!e.target.closest(".priceCurrency")
){

currency.style.display = "none";

}

});

        .getElementById("cards")
        .scrollIntoView({
          behavior:"smooth",
          block:"start"
        });

        setTimeout(()=>{

          status.style.display =
          "none";

        },700);

      },900);

    },400);

  });

}
 
/* PAYHIP IFRAME FLOATING BAR FIX */

function repositionBottomBar(){

  const bar =
  document.getElementById("bottomFilterBar");

  if(!bar) return;

  const scrollTop =
  window.scrollY;

  const viewportHeight =
  window.innerHeight;

  const barHeight =
  bar.offsetHeight;

  const top =
  scrollTop +
  viewportHeight -
  barHeight -
  14;

  bar.style.top =
  top + "px";
}

/* update while scrolling */
window.addEventListener(
"scroll",
repositionBottomBar
);

window.addEventListener(
"resize",
repositionBottomBar
);

/* run initially */
setTimeout(
repositionBottomBar,
500
);


</script>
