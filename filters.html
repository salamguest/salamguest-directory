<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SalamGuest Directory</title>

<link href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:wght@600&family=Lexend:wght@300;400;500&display=swap" rel="stylesheet">

<style>

body{
margin:0;
background:white;
font-family:'Lexend',sans-serif;
}

/* LAYOUT */

.container{
display:flex;
}

/* SIDEBAR */

.sidebar{
width:270px;
padding:20px;
border-right:1px solid #eee;
}

.filterHeader{
font-size:14px;
margin-bottom:15px;
line-height:1.4;
}

.filterCategory{
margin-bottom:18px;
}

.filterTitle{
font-weight:500;
margin-bottom:6px;
}

/* TAGS */

.tag{
display:inline-flex;
align-items:center;
justify-content:center;
padding:6px 10px;
margin:4px 4px 0 0;
background:#f2f2f2;
border-radius:20px;
cursor:pointer;
font-size:13px;
text-align:center;
}

.tag.active{
background:#0042FD;
color:white;
}

/* MAIN */

.main{
flex:1;
padding:20px;
}

.search input{
width:100%;
padding:10px;
border:1px solid #ddd;
border-radius:8px;
}

/* GRID */

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:22px;
margin-top:20px;
}

/* CARD */

.card{
background:white;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.08);
overflow:hidden;
display:flex;
flex-direction:column;
}

.carousel img{
width:100%;
height:180px;
object-fit:cover;
cursor:pointer;
}

.cardBody{
padding:14px;
display:flex;
flex-direction:column;
flex-grow:1;
}

.title{
font-family:'Libre Bodoni';
font-size:20px;
}

.location{
font-size:13px;
color:#777;
margin-bottom:8px;
}

.description{
font-size:13px;
color:#555;
}

.bottom{
margin-top:auto;
}

.price{
font-family:'Libre Bodoni';
font-size:18px;
margin-top:10px;
}

.rating{
font-size:14px;
}

.ratingSmall{
font-size:10px;
color:#777;
}

.book{
display:block;
margin-top:8px;
padding:9px;
text-align:center;
background:#0042FD;
color:white;
border-radius:20px;
text-decoration:none;
}

.book:hover{
background:#eee;
color:#0042FD;
border:1px solid #0042FD;
}

/* PAGINATION */

.bottomNav{
display:flex;
justify-content:space-between;
margin-top:20px;
}

.pageBtn{
padding:6px 10px;
margin:4px;
border:1px solid #0042FD;
background:white;
cursor:pointer;
}

.pageBtn.active{
background:#0042FD;
color:white;
}

/* LIGHTBOX */

.lightbox{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
display:none;
justify-content:center;
align-items:center;
z-index:999;
}

.lightbox img{
max-width:90%;
max-height:90%;
}

/* MOBILE */

@media(max-width:900px){

.container{
flex-direction:column;
}

.sidebar{
width:100%;
border-right:none;
border-bottom:1px solid #eee;
}

.filterCategory{
display:block;
}

.grid{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<div class="container">

<div class="sidebar">

<div class="filterHeader">
Explore 50+ Halal-Filters to find Muslim-Friendly Accomodations & Stays wherever you go.
</div>

<div id="filters"></div>

</div>

<div class="main">

<div class="search">
<input id="searchInput" placeholder="Search hotel, stay or any keyword">
</div>

<div class="grid" id="cards"></div>

<div class="bottomNav">
<div onclick="window.scrollTo({top:0,behavior:'smooth'})">Back To Top</div>
<div id="pagination"></div>
</div>

</div>

</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
<img id="lightboxImg">
</div>

<script>

const SHEET_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSYw1Ah01StvD_FKZvGw7M_pxB8_mxLhYDwE9rT7PEmK5n7VS7mxIi0FQZ1BezpycxRhOaXzrpwyRHU/pub?gid=0&single=true&output=csv";

const MAX_ITEMS=20;
const ITEMS_PER_PAGE=12;

let data=[];
let activeFilters=[];
let currentPage=1;

/* FILTER ORDER */

const FILTER_ORDER=[
"Property Type",
"Meals",
"Facilities",
"Transport",
"Retail",
"Leisure",
"Convenience",
"Female Only"
];

/* SAFE CSV */

function parseCSV(text){

const rows=text.trim().split("\n");
const headers=rows[0].split(",");

return rows.slice(1).map(row=>{
const cols=row.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g);

let obj={};
headers.forEach((h,i)=>{
obj[h.trim()]=cols?.[i]?.replaceAll('"',"") || "";
});
return obj;
});

}

/* LOAD */

async function load(){

const res=await fetch(SHEET_URL);
const text=await res.text();

data=parseCSV(text);

buildFilters();
render();

}

/* BUILD FILTERS */

function buildFilters(){

const container=document.getElementById("filters");
container.innerHTML="";

/* group tags */

let groups={};

data.forEach(item=>{

(item.filter_tags||"").split(",").forEach(tag=>{

let parts=tag.split(":");

if(parts.length<2)return;

let cat=parts[0].trim();
let val=parts[1].trim();

if(!groups[cat])groups[cat]=new Set();
groups[cat].add(val);

});

});

/* render in order */

FILTER_ORDER.forEach(cat=>{

if(!groups[cat])return;

let block=document.createElement("div");
block.className="filterCategory";

block.innerHTML=`<div class="filterTitle">${cat}</div>`;

groups[cat].forEach(tag=>{

let el=document.createElement("div");
el.className="tag";
el.innerText=tag;

el.onclick=()=>toggle(tag,cat,el);

block.appendChild(el);

});

container.appendChild(block);

});

}

/* TOGGLE */

function toggle(tag,cat,el){

let full=cat+":"+tag;

if(activeFilters.includes(full)){
activeFilters=activeFilters.filter(t=>t!==full);
el.classList.remove("active");
}else{
activeFilters.push(full);
el.classList.add("active");
}

render();

}

/* CAROUSEL */

function startCarousel(img,folder){

let i=1;

setInterval(()=>{
i=i===3?1:i+1;
img.src=`/images/${folder}/${i}.jpg`;
},2500);

}

/* LIGHTBOX */

function openLightbox(src){
document.getElementById("lightboxImg").src=src;
document.getElementById("lightbox").style.display="flex";
}

function closeLightbox(){
document.getElementById("lightbox").style.display="none";
}

/* RENDER */

function render(){

const search=document.getElementById("searchInput").value.toLowerCase();

let filtered=data.filter(item=>{

let tags=(item.filter_tags||"").toLowerCase();

let match=activeFilters.every(f=>tags.includes(f.toLowerCase()));

let matchSearch=(item.name||"").toLowerCase().includes(search);

return match && matchSearch;

});

filtered=filtered.slice(0,MAX_ITEMS);

const cards=document.getElementById("cards");

cards.innerHTML=filtered.map(item=>{

let folder=item.image_folder||"";

let img=`/images/${folder}/1.jpg`;

return `

<div class="card">

<div class="carousel">
<img src="${img}" onerror="this.src='/images/placeholder.jpg'" onclick="openLightbox(this.src)">
</div>

<div class="cardBody">

<div class="title">${item.name}</div>
<div class="location">${item.city}, ${item.country}</div>
<div class="description">${item.description}</div>

<div class="bottom">

<div class="price">${item.price}</div>

<div class="rating">${item.rating} / 5
<div class="ratingSmall">Average Rating</div>
</div>

<a class="book" href="${item.link}" target="_blank">BOOK</a>

</div>

</div>

</div>

`;

}).join("");

/* START CAROUSEL */

document.querySelectorAll(".carousel img").forEach((img,i)=>{
let folder=filtered[i].image_folder;
if(folder) startCarousel(img,folder);
});

}

/* SEARCH */

document.getElementById("searchInput").addEventListener("keydown",e=>{
if(e.key==="Enter") render();
});

load();

</script>

</body>
</html>
