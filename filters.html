<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SalamGuest Directory</title>

<link href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:wght@600&family=Lexend:wght@300;400;500&display=swap" rel="stylesheet">

<style>

body{
margin:0;
background:white;
font-family:'Lexend',sans-serif;
}

.container{
display:flex;
}

/* SIDEBAR */

.sidebar{
width:260px;
padding:20px;
border-right:1px solid #eee;
}

.filterCategory{
margin-bottom:18px;
}

.filterTitle{
font-weight:600;
margin-bottom:8px;
}

.tag{
display:block;
padding:7px 10px;
margin:4px 0;
background:#f2f2f2;
border-radius:18px;
cursor:pointer;
font-size:13px;
}

.tag.active{
background:#0042FD;
color:white;
}

/* MAIN */

.main{
flex:1;
padding:20px;
}

/* SEARCH */

.search input{
width:100%;
padding:10px;
border:1px solid #ddd;
border-radius:8px;
font-family:'Lexend';
}

/* GRID */

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:22px;
margin-top:20px;
}

/* CARD */

.card{
background:white;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.08);
overflow:hidden;
display:flex;
flex-direction:column;
}

.carousel img{
width:100%;
height:180px;
object-fit:cover;
cursor:pointer;
}

.cardBody{
padding:14px;
display:flex;
flex-direction:column;
flex-grow:1;
}

.title{
font-family:'Libre Bodoni',serif;
font-size:20px;
margin-bottom:4px;
}

.location{
font-size:13px;
color:#777;
margin-bottom:8px;
}

.description{
font-size:13px;
color:#555;
line-height:1.4;
}

.bottom{
margin-top:auto;
}

.price{
font-family:'Libre Bodoni',serif;
font-size:18px;
margin-top:10px;
}

.rating{
margin-top:4px;
font-size:14px;
}

.ratingSmall{
font-size:10px;
color:#777;
}

.book{
display:block;
margin-top:8px;
padding:9px;
text-align:center;
background:#0042FD;
color:white;
text-decoration:none;
border-radius:20px;
transition:0.2s;
}

.book:hover{
background:#eee;
color:#0042FD;
border:1px solid #0042FD;
}

/* PAGINATION */

.bottomNav{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:20px;
}

.backTop{
font-size:13px;
color:#0042FD;
cursor:pointer;
}

.pageBtn{
padding:6px 10px;
margin:4px;
border:1px solid #0042FD;
background:white;
cursor:pointer;
}

.pageBtn.active{
background:#0042FD;
color:white;
}

/* LIGHTBOX */

.lightbox{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
display:none;
justify-content:center;
align-items:center;
z-index:999;
}

.lightbox img{
max-width:90%;
max-height:90%;
}

/* MOBILE */

@media(max-width:900px){

.container{
flex-direction:column;
}

.sidebar{
width:100%;
display:flex;
overflow-x:auto;
gap:10px;
}

.filterCategory{
display:flex;
gap:6px;
}

.tag{
display:inline-block;
white-space:nowrap;
}

.grid{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<div class="container">

<div class="sidebar" id="filters"></div>

<div class="main">

<div class="search">
<input id="searchInput" placeholder="Search hotel, stay or any keyword">
</div>

<div class="grid" id="cards"></div>

<div class="bottomNav">

<div class="backTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">
Back To Top
</div>

<div id="pagination"></div>

</div>

</div>

</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
<img id="lightboxImg">
</div>

<script>

const SHEET_URL="YOUR_CSV_LINK_HERE";

const MAX_ITEMS=20;
const ITEMS_PER_PAGE=12;

let data=[];
let activeFilters=[];
let currentPage=1;

/* FILTER CATEGORIES */

const FILTERS={

"Property Type":[
"Hotel","Resort","Villa","Apartment"
],

"Halal Essentials":[
"Halal Food Nearby","Halal Kitchen","No Alcohol"
],

"Amenities":[
"Pool","Spa","Gym","Parking"
]

};

async function loadData(){

const res=await fetch(SHEET_URL);
const text=await res.text();

const rows=text.split("\n").slice(1);

data=rows.map(r=>{

const c=r.split(",");

return{
name:c[0],
city:c[1],
country:c[2],
description:c[3],
price:c[4],
rating:c[5],
image_folder:c[6],
link:c[7],
tags:c[8]
};

});

buildFilters();
render();

}

function buildFilters(){

const sidebar=document.getElementById("filters");

for(let cat in FILTERS){

const block=document.createElement("div");
block.className="filterCategory";

block.innerHTML=`<div class="filterTitle">${cat}</div>`;

FILTERS[cat].forEach(tag=>{

const t=document.createElement("div");
t.className="tag";
t.innerText=tag;

t.onclick=()=>toggleFilter(tag,t);

block.appendChild(t);

});

sidebar.appendChild(block);

}

}

function toggleFilter(tag,el){

if(activeFilters.includes(tag)){
activeFilters=activeFilters.filter(t=>t!==tag);
el.classList.remove("active");
}else{
activeFilters.push(tag);
el.classList.add("active");
}

currentPage=1;
render();

}

function render(){

const search=document.getElementById("searchInput").value.toLowerCase();

let filtered=data.filter(item=>{

const tags=(item.tags||"").toLowerCase();

const matchFilter=activeFilters.every(f=>tags.includes(f.toLowerCase()));

const matchSearch=item.name.toLowerCase().includes(search) ||
(item.description||"").toLowerCase().includes(search);

return matchFilter && matchSearch;

});

filtered=filtered.slice(0,MAX_ITEMS);

const start=(currentPage-1)*ITEMS_PER_PAGE;

const pageData=filtered.slice(start,start+ITEMS_PER_PAGE);

const cards=document.getElementById("cards");

cards.innerHTML=pageData.map(item=>{

const img=`/images/${item.image_folder}/1.jpg`;

return `

<div class="card">

<div class="carousel">
<img src="${img}" onerror="this.src='/images/placeholder.jpg'" onclick="openLightbox(this.src)">
</div>

<div class="cardBody">

<div class="title">${item.name}</div>
<div class="location">${item.city}, ${item.country}</div>
<div class="description">${item.description}</div>

<div class="bottom">

<div class="price">${item.price}</div>

<div class="rating">
${item.rating} / 5
<div class="ratingSmall">Average Rating</div>
</div>

<a class="book" href="${item.link}" target="_blank">BOOK</a>

</div>

</div>

</div>

`;

}).join("");

renderPagination(filtered.length);

}

function renderPagination(total){

const pages=Math.ceil(total/ITEMS_PER_PAGE);

let html="";

for(let i=1;i<=pages;i++){

html+=`<button class="pageBtn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;

}

document.getElementById("pagination").innerHTML=html;

}

function goPage(p){

currentPage=p;
render();

}

function openLightbox(src){

const lb=document.getElementById("lightbox");
const img=document.getElementById("lightboxImg");

img.src=src;
lb.style.display="flex";

}

function closeLightbox(){

document.getElementById("lightbox").style.display="none";

}

document.getElementById("searchInput").addEventListener("keydown",e=>{

if(e.key==="Enter"){
render();
}

});

loadData();

</script>

</body>
</html>
