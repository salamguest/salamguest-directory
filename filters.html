<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SalamGuest Directory - Basic Filters</title>

<link href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:wght@600&family=Lexend:wght@300;400;500&display=swap" rel="stylesheet">

<style>
/* Your styling for layout here */
</style>

</head>
<body>

<div class="container">

<div class="sidebar" id="filters"></div>

<div class="main">

<div class="search">
<input id="searchInput" placeholder="Search hotel, stay or any keyword">
</div>

<div style="margin-top:10px;">
<button onclick="clearFilters()" style="
padding:8px 14px;
border:2px solid #0042FD;
border-radius:999px;
background:white;
color:#0042FD;
cursor:pointer;
font-family:Lexend;">
Clear Filters
</button>
</div>

<div class="grid" id="cards"></div>

<div class="bottomNav">
<div class="backTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">
Back To Top
</div>
<div id="pagination"></div>
</div>

</div>

</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
<img id="lightboxImg">
</div>

<script>

const SHEET_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSYw1Ah01StvD_FKZvGw7M_pxB8_mxLhYDwE9rT7PEmK5n7VS7mxIi0FQZ1BezpycxRhOaXzrpwyRHU/pub?gid=0&single=true&output=csv";

const MAX_ITEMS=20;
const ITEMS_PER_PAGE=12;

let data=[];
let activeFilters=[];
let currentPage=1;

function slugify(text){
return text.toLowerCase().trim()
.replace(/[^a-z0-9\s-]/g,'')
.replace(/\s+/g,'-')
.replace(/-+/g,'-');
}

function parseCSV(text){
const rows=text.trim().split("\n");
const headers=rows[0].split(",");
return rows.slice(1).map(row=>{
const cols=row.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g);
let obj={};
headers.forEach((h,i)=>{
obj[h.trim()]=cols?.[i]?.replaceAll('"',"") || "";
});
return obj;
});

}

async function load(){
const res=await fetch(SHEET_URL);
const text=await res.text();
data=parseCSV(text);
buildFilters();
render();
}

function buildFilters(){
const groups={};

data.forEach(item=>{
(item.filter_tags||"").split(",").forEach(tag=>{
let [cat,val]=tag.split(":");
if(!cat||!val)return;

if(!groups[cat])groups[cat]=new Set();
groups[cat].add(val.trim());
});
});

const order=["Property Type","Meals","Facilities","Transport","Retail","Leisure","Convenience","Female Only"];

const container=document.getElementById("filters");

order.forEach(cat=>{
if(!groups[cat])return;

let block=document.createElement("div");
block.className="filterCategory";
block.innerHTML=`<div class="filterTitle">${cat}</div>`;

groups[cat].forEach(val=>{
let el=document.createElement("div");
el.className="tag";
el.innerText=val;

el.onclick=()=>toggle(cat+":"+val,el);

block.appendChild(el);

});

container.appendChild(block);

});

}

function toggle(tag,el){
if(activeFilters.includes(tag)){
activeFilters=activeFilters.filter(t=>t!==tag);
el.classList.remove("active");
}else{
activeFilters.push(tag);
el.classList.add("active");
}
currentPage=1;
render();
}

function clearFilters(){
activeFilters=[];
currentPage=1;
document.querySelectorAll('.tag').forEach(t=>t.classList.remove('active'));
render();
}

function openLightbox(src){
document.getElementById("lightboxImg").src=src;
document.getElementById("lightbox").style.display="flex";
}

function closeLightbox(){
document.getElementById("lightbox").style.display="none";
}

function render(){

const search=document.getElementById("searchInput").value.toLowerCase();

let filtered=data.filter(item=>{
let tags=(item.filter_tags||"").toLowerCase();
let match=activeFilters.every(f=>tags.includes(f.toLowerCase()));
let matchSearch=(item.name||"").toLowerCase().includes(search) || (item.description||"").toLowerCase().includes(search);
return match && matchSearch;
});

filtered=filtered.slice(0,MAX_ITEMS);

const start=(currentPage-1)*ITEMS_PER_PAGE;
const pageData=filtered.slice(start,start+ITEMS_PER_PAGE);

const cards=document.getElementById("cards");

cards.innerHTML=pageData.map(item=>{

const folder=slugify(item.name);
let img=`/images/${folder}/1.jpg`;

return `
<div class="card">
<div class="carousel">
<img src="/images/placeholder.jpg"
onerror="this.src='/images/placeholder.jpg'"
data-real="${img}"
onclick="openLightbox(this.src)">
</div>

<div class="cardBody">
<div class="title">${item.name}</div>
<div class="location">${item.city}, ${item.country}</div>
<div class="description">${item.description}</div>

<div class="bottom">
<div class="price">${item.price}</div>

<div class="rating">
${item.rating} / 5
<div class="ratingSmall">Average Rating</div>
</div>

<div class="tags">${(item.card_tags || "").split(",").map(tag=>`<span class="tag">${tag}</span>`).join("")}</div>

<a class="book" href="${item.link}" target="_blank">BOOK</a>
</div>

</div>
</div>
`;
}).join("");

renderPagination(filtered.length);

document.querySelectorAll(".carousel img").forEach(img=>{
const real=img.dataset.real;
const test=new Image();
test.onload=()=>{
img.src=real;
};
test.onerror=()=>{
img.src="/images/placeholder.jpg";
};
test.src=real;

});

}

function renderPagination(total){
const pages=Math.ceil(total/ITEMS_PER_PAGE);
let html="";
for(let i=1;i<=pages;i++){
html+=`<button class="pageBtn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
}
document.getElementById("pagination").innerHTML=html;
}

function goPage(p){
currentPage=p;
render();
}

document.getElementById("searchInput").addEventListener("keydown",e=>{
if(e.key==="Enter") render();
});

load();

</script>

</body>
</html>
