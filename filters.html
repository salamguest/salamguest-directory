<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SalamGuest Directory</title>

<link href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:wght@700&family=Lexend:wght@400;500&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Lexend;
background:#fff;
color:#222;
}

/* LAYOUT */
.container{
display:flex;
padding:20px;
gap:20px;
}

.sidebar{
width:260px;
flex-shrink:0;
}

.main{
flex:1;
}

/* FILTERS */
.filterTitle{
font-size:14px;
font-weight:500;
margin-top:18px;
margin-bottom:8px;
}

.tag{
display:inline-flex;
align-items:center;
justify-content:center;
padding:8px 14px;
margin:4px 4px 0 0;
background:#f2f2f2;
border-radius:999px;
font-size:13px;
cursor:pointer;
}

.tag.active{
background:#0042FD;
color:#fff;
}

/* SEARCH */
.search input{
width:100%;
padding:12px;
border-radius:12px;
border:1px solid #dbe4ff;
background:#eef3ff;
font-family:Lexend;
box-sizing:border-box;
}

/* CURRENCY */
.currencyBar{
margin-bottom:12px;
font-size:14px;
}

#currencySelect{
border:none;
border-bottom:1px solid #0042FD;
background:transparent;
font-family:Lexend;
color:#0042FD;
cursor:pointer;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
margin-top:20px;
}

/* CARD */
.card{
background:#fff;
border-radius:14px;
box-shadow:0 3px 14px rgba(0,0,0,0.08);
overflow:hidden;
display:flex;
flex-direction:column;
}

/* IMAGE */
.carousel img{
width:100%;
height:210px;
object-fit:cover;
}

/* BODY */
.cardBody{
padding:16px;
display:flex;
flex-direction:column;
flex-grow:1;
}

.title{
font-family:"Libre Bodoni";
font-size:22px;
}

.location{
font-size:13px;
color:#666;
margin-bottom:6px;
}

.description{
font-size:13px;
color:#444;
}

/* PRICE */
.price{
font-family:"Libre Bodoni";
font-size:20px;
margin-top:10px;
}

.currencyClickable{
text-decoration:underline;
}

/* TAGS (FIXED PADDING) */
.cardTags{
margin-top:10px;
display:flex;
flex-wrap:wrap;
gap:6px;
}

.cardTags span{
background:#eaf0ff;
color:#0042FD;
padding:8px 12px;
border-radius:999px;
font-size:11px;
}

/* BUTTON */
.book{
margin-top:12px;
padding:12px;
text-align:center;
background:#0042FD;
color:#fff;
border-radius:999px;
text-decoration:none;
}

/* MOBILE */
@media(max-width:900px){
.container{flex-direction:column;}
.sidebar{width:100%;}
.grid{grid-template-columns:1fr;}
}

</style>

</head>

<body>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar" id="filters"></div>

<!-- MAIN -->
<div class="main">

<div class="currencyBar">
Currency:
<select id="currencySelect" onchange="changeCurrency(this.value)">
<option value="MYR">MYR</option>
<option value="USD">USD</option>
<option value="SGD">SGD</option>
<option value="GBP">GBP</option>
<option value="EUR">EUR</option>
<option value="JPY">JPY</option>
<option value="SAR">SAR</option>
<option value="AED">AED</option>
<option value="IDR">IDR</option>
<option value="TRY">TRY</option>
</select>
</div>

<div class="search">
<input id="searchInput" placeholder="Search hotel, stay or any keyword">
</div>

<div class="grid" id="cards"></div>

</div>
</div>

<script>

const SHEET_URL="YOUR_SHEET_URL_HERE";

let data=[];
let activeFilters=[];
let currentCurrency="MYR";

/* LIVE RATES */
let exchangeRates={MYR:1};

async function loadRates(){

try{

const res=await fetch("https://api.exchangerate.host/latest?base=MYR");
const json=await res.json();

exchangeRates={
MYR:1,
USD:json.rates.USD,
SGD:json.rates.SGD,
GBP:json.rates.GBP,
EUR:json.rates.EUR,
JPY:json.rates.JPY,
SAR:json.rates.SAR,
AED:json.rates.AED,
IDR:json.rates.IDR,
TRY:json.rates.TRY
};

}catch(e){

/* fallback */
exchangeRates={
MYR:1,
USD:0.21,
SGD:0.30,
GBP:0.16,
EUR:0.19,
JPY:30,
SAR:0.79,
AED:0.77,
IDR:3300,
TRY:6.5
};

}

}

/* CURRENCY SWITCH */
function changeCurrency(c){
currentCurrency=c;
render();
}

/* PRICE FORMAT */
function formatPrice(price){

let num=parseFloat(price)||0;

let converted=num*exchangeRates[currentCurrency];

converted=converted.toFixed(2);

return `<span class="currencyClickable">${currentCurrency}</span> ${converted} / night`;
}

/* LOAD */
async function load(){

await loadRates();

const res=await fetch(SHEET_URL);
const text=await res.text();

data=parseCSV(text);

render();

}

function parseCSV(text){

const rows=text.trim().split("\n");
const headers=rows[0].split(",");

return rows.slice(1).map(r=>{

const cols=r.split(",");

let obj={};

headers.forEach((h,i)=>{
obj[h.trim()]=cols[i];
});

return obj;

});

}

/* RENDER */
function render(){

const search=document.getElementById("searchInput").value.toLowerCase();

let filtered=data.filter(i=>{

return (i.name||"").toLowerCase().includes(search)
|| (i.description||"").toLowerCase().includes(search);

});

const cards=document.getElementById("cards");

cards.innerHTML=filtered.map(i=>`

<div class="card">

<img src="${i.image}" onerror="this.src='images/placeholder.jpg'">

<div class="cardBody">

<div class="title">${i.name}</div>
<div class="location">${i.location}</div>
<div class="description">${i.description}</div>

<div class="price">
${formatPrice(i.price)}
</div>

<div class="cardTags">
${(i.tags||"").split(",").map(t=>`<span>${t}</span>`).join("")}
</div>

<a class="book" href="${i.link}" target="_blank">BOOK</a>

</div>

</div>

`).join("");

}

document.getElementById("searchInput").addEventListener("input",render);

load();

</script>

</body>
</html>
