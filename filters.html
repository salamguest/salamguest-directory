<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SalamGuest Directory</title>

<link href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:wght@700&family=Lexend:wght@400;500&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Lexend,sans-serif;
background:#fff;
color:#222;
}

.container{
display:flex;
gap:20px;
padding:20px;
}

/* SIDEBAR */

.sidebar{
width:260px;
flex-shrink:0;
}

.filterTitle{
font-size:14px;
font-weight:500;
margin-top:18px;
margin-bottom:8px;
}

.tag{
display:inline-flex;
align-items:center;
justify-content:center;
padding:8px 14px;
margin:4px 4px 0 0;
background:#f2f2f2;
border-radius:999px;
font-size:13px;
cursor:pointer;
transition:0.2s;
text-align:center;
}

.tag.active{
background:#0042FD;
color:#fff;
}

/* MAIN */

.main{
flex:1;
}

/* SEARCH */

.search{
position:relative;
}

.search input{
width:100%;
padding:12px 52px 12px 14px;
border-radius:12px;
border:1px solid #dbe4ff;
background:#eef3ff;
font-family:Lexend;
font-size:14px;
box-sizing:border-box;
box-shadow:
inset 0 2px 6px rgba(0,0,0,0.08);
outline:none;
}

.searchBtn{
position:absolute;
right:8px;
top:50%;
transform:translateY(-50%);
width:36px;
height:36px;
border:none;
background:#0042FD;
border-radius:999px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
padding:0;
}

.searchBtn svg{
width:18px;
height:18px;
stroke:white;
stroke-width:2.2;
fill:none;
}

/* TOP BUTTONS */

.topButtons{
margin-top:10px;
display:flex;
gap:10px;
flex-wrap:wrap;
align-items:center;
}

.clearBtn{
padding:8px 16px;
border-radius:999px;
border:2px solid #0042FD;
background:white;
color:#0042FD;
cursor:pointer;
font-family:Lexend;
}

.sortSelect{
padding:8px 14px;
border-radius:999px;
border:1px solid #dbe4ff;
background:#eef3ff;
font-family:Lexend;
font-size:13px;
cursor:pointer;
outline:none;
color:#444;
}

.currencyTopBtn{
padding:8px 14px;
border-radius:999px;
border:1px solid #dbe4ff;
background:#eef3ff;
font-family:Lexend;
font-size:13px;
cursor:pointer;
color:#444;
}

/* GRID */

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:22px;
margin-top:20px;
}

/* CARD */

.card{
background:white;
border-radius:16px;
overflow:hidden;
box-shadow:0 3px 10px rgba(0,0,0,0.14);
display:flex;
flex-direction:column;
}

/* CAROUSEL */

.carouselWrap{
position:relative;
overflow:hidden;
}

.carousel{
display:flex;
overflow-x:auto;
scroll-snap-type:x mandatory;
scroll-behavior:smooth;
-ms-overflow-style:none;
scrollbar-width:none;
}

.carousel::-webkit-scrollbar{
display:none;
}

.carousel img{
width:100%;
height:220px;
object-fit:cover;
flex-shrink:0;
scroll-snap-align:start;
}

/* INDICATORS */

.carouselIndicators{
position:absolute;
bottom:10px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:5px;
z-index:2;
}

.carouselIndicators span{
width:16px;
height:3px;
border-radius:999px;
background:rgba(255,255,255,0.4);
transition:0.2s;
}

.carouselIndicators span.active{
background:white;
}

/* CARD BODY */

.cardBody{
padding:16px;
display:flex;
flex-direction:column;
flex-grow:1;
}

.title{
font-family:"Libre Bodoni",serif;
font-size:24px;
line-height:1.2;
margin-bottom:4px;
}

.location{
font-size:13px;
color:#666;
margin-bottom:2px;
}

.description{
font-size:13px;
line-height:1.6;
color:#444;
white-space:pre-line;
}

.priceWrap{
margin-top:14
