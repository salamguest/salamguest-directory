<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SalamGuest Directory</title>

<link href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:wght@700&family=Lexend:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#ffffff;
font-family:'Lexend',sans-serif;
color:#222;
}

/* LAYOUT */

.container{
display:flex;
gap:24px;
padding:20px;
align-items:flex-start;
}

.sidebar{
width:260px;
flex-shrink:0;
}

.main{
flex:1;
min-width:0;
}

/* FILTERS */

.filterTitle{
font-size:14px;
font-weight:500;
margin-top:20px;
margin-bottom:10px;
color:#111;
}

.tag{
display:inline-flex;
align-items:center;
justify-content:center;
padding:8px 14px;
margin:4px 4px 0 0;
background:#f2f2f2;
border-radius:999px;
font-size:13px;
cursor:pointer;
transition:0.2s;
text-align:center;
}

.tag.active{
background:#0042FD;
color:white;
}

/* SEARCH */

.search{
position:relative;
}

.search input{
width:100%;
padding:14px 54px 14px 16px;
border-radius:14px;
border:1px solid #dbe4ff;
background:#eef3ff;
font-family:'Lexend',sans-serif;
font-size:14px;
outline:none;
box-shadow:
inset 0 2px 7px rgba(0,0,0,0.08);
}

.searchBtn{
position:absolute;
right:8px;
top:50%;
transform:translateY(-50%);
width:38px;
height:38px;
border:none;
background:#0042FD;
border-radius:999px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
padding:0;
}

.searchBtn svg{
width:18px;
height:18px;
stroke:white;
stroke-width:2.2;
fill:none;
}

/* TOP BUTTONS */

.topButtons{
display:flex;
gap:10px;
margin-top:12px;
flex-wrap:wrap;
align-items:center;
}

.clearBtn{
padding:9px 16px;
border-radius:999px;
border:2px solid #0042FD;
background:white;
color:#0042FD;
font-family:'Lexend',sans-serif;
cursor:pointer;
}

.sortSelect{
padding:9px 14px;
border-radius:999px;
border:1px solid #dbe4ff;
background:#eef3ff;
font-family:'Lexend',sans-serif;
font-size:13px;
cursor:pointer;
outline:none;
color:#444;
}

.currencyTopBtn{
padding:9px 14px;
border-radius:999px;
border:1px solid #dbe4ff;
background:#eef3ff;
font-family:'Lexend',sans-serif;
font-size:13px;
cursor:pointer;
outline:none;
color:#444;
}

/* GRID */

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:22px;
margin-top:22px;
}

/* CARD */

.card{
background:white;
border-radius:18px;
overflow:hidden;
box-shadow:0 3px 10px rgba(0,0,0,0.14);
display:flex;
flex-direction:column;
}

/* CAROUSEL */

.carouselWrap{
position:relative;
overflow:hidden;
}

.carousel{
display:flex;
overflow-x:auto;
scroll-snap-type:x mandatory;
scroll-behavior:smooth;
-ms-overflow-style:none;
scrollbar-width:none;
}

.carousel::-webkit-scrollbar{
display:none;
}

.carousel img{
width:100%;
height:220px;
object-fit:cover;
flex-shrink:0;
scroll-snap-align:start;
}

/* CAROUSEL LINES */

.carouselIndicators{
position:absolute;
bottom:10px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:5px;
z-index:2;
}

.carouselIndicators span{
width:16px;
height:3px;
border-radius:999px;
background:rgba(255,255,255,0.4);
transition:0.2s;
}

.carouselIndicators span.active{
background:white;
}

/* CARD BODY */

.cardBody{
padding:16px;
display:flex;
flex-direction:column;
flex-grow:1;
}

.title{
font-family:'Libre Bodoni',serif;
font-size:24px;
line-height:1.2;
margin-bottom:4px;
}

.location{
font-size:13px;
color:#666;
margin-bottom:2px;
}

.description{
font-size:13px;
line-height:1.6;
color:#444;
white-space:pre-line;
}

/* PRICE */

.priceWrap{
margin-top:14px;
display:flex;
align-items:flex-start;
gap:8px;
flex-wrap:wrap;
}

.priceLabel{
font-family:'Libre Bodoni',serif;
font-size:10px;
letter-spacing:1.4px;
color:#777;
padding-top:4px;
}

.priceAmount{
font-family:'Libre Bodoni',serif;
font-size:26px;
line-height:1;
}

.priceCurrency{
margin-top:8px;
font-size:11px;
color:#666;
letter-spacing:0.3px;
cursor:pointer;
display:inline-block;
border-bottom:1px dotted #666;
width:fit-content;
margin-left:2px;
}

/* RATING */

.rating{
margin-top:12px;
font-size:14px;
color:#0042FD;
}

.ratingSmall{
font-size:10px;
color:#777;
margin-top:2px;
}

/* TAGS */

.tagsRow{
display:flex;
flex-wrap:wrap;
gap:6px;
margin-top:12px;
}

.cardTag{
display:inline-flex;
align-items:center;
justify-content:center;
background:#eaf0ff;
color:#0042FD;
padding:8px 12px;
border-radius:999px;
font-size:11px;
line-height:1.2;
}

/* BOOK BUTTON */

.book{
display:block;
margin-top:16px;
padding:12px;
text-align:center;
background:#0042FD;
color:white;
text-decoration:none;
border-radius:999px;
border:2px solid #0042FD;
transition:0.2s;
}

.book:hover{
background:#f5f5f5;
color:#0042FD;
}

/* QUICK LINKS */

.relatedLinks{
margin-top:12px;
font-size:11px;
line-height:1.8;
letter-spacing:0.4px;
}

.relatedLinks a{
color:#324a7d;
text-decoration:underline;
margin-right:10px;
}

.relatedLinks a:hover{
color:#0042FD;
}

/* PUSH CONTENT */

.bottom{
margin-top:auto;
}

/* PAGINATION */

.bottomNav{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:24px;
}

.pageBtn{
padding:7px 12px;
margin:2px;
border:1px solid #0042FD;
background:white;
color:#0042FD;
cursor:pointer;
border-radius:8px;
}

.pageBtn.active{
background:#0042FD;
color:white;
}

/* NO RESULTS */

#noResults{
display:none;
text-align:center;
margin-top:40px;
font-size:14px;
color:#666;
}

/* REDIRECT OVERLAY */

#redirectOverlay{
position:fixed;
inset:0;
background:rgba(0,0,0,0.45);
display:none;
align-items:center;
justify-content:center;
z-index:99999;
}

.redirectBox{
background:white;
padding:24px;
border-radius:18px;
text-align:center;
width:240px;
box-shadow:0 10px 40px rgba(0,0,0,0.15);
}

.spinner{
width:32px;
height:32px;
border:3px solid #ddd;
border-top-color:#0042FD;
border-radius:50%;
margin:0 auto 16px;
animation:spin 1s linear infinite;
}

@keyframes spin{
to{
transform:rotate(360deg);
}
}

/* MOBILE */

@media(max-width:900px){

.container{
flex-direction:column;
padding:12px;
}

.sidebar{
width:100%;
}

.grid{
grid-template-columns:1fr;
}

.topButtons{
flex-direction:column;
align-items:stretch;
}

.clearBtn,
.sortSelect,
.currencyTopBtn{
width:100%;
text-align:center;
}

.sortSelect{
text-align:center;
text-align-last:center;
}

}

</style>

</head>

<body>

<div class="container">

<!-- SIDEBAR -->

<div class="sidebar" id="filters"></div>

<!-- MAIN -->

<div class="main">

<!-- SEARCH -->

<div class="search">

<input
id="searchInput"
placeholder="Search hotel, stay or any keyword"
>

<button class="searchBtn" onclick="render()">

<svg viewBox="0 0 24 24">
<circle cx="11" cy="11" r="7"></circle>
<line x1="16.65" y1="16.65" x2="21" y2="21"></line>
</svg>

</button>

</div>

<!-- TOP BUTTONS -->

<div class="topButtons">

<button class="clearBtn" onclick="clearAll()">
Clear
</button>

<select id="sortSelect" class="sortSelect" onchange="render()">

<option value="default">Sort</option>
<option value="lowHigh">Price: Low to High</option>
<option value="highLow">Price: High to Low</option>
<option value="ratingHigh">Highest Rated</option>
<option value="ratingLow">Lowest Rated</option>

</select>

<select id="currencySelect"
class="currencyTopBtn"
onchange="setCurrency(this.value)">

<option value="MYR">MYR</option>
<option value="USD">USD</option>
<option value="SGD">SGD</option>
<option value="GBP">GBP</option>
<option value="EUR">EUR</option>
<option value="JPY">JPY</option>
<option value="SAR">SAR</option>
<option value="AED">AED</option>
<option value="IDR">IDR</option>
<option value="TRY">TRY</option>

</select>

</div>

<!-- NO RESULTS -->

<div id="noResults">
No results found. Please try a different keyword.
</div>

<!-- CARDS -->

<div class="grid" id="cards"></div>

<!-- BOTTOM -->

<div class="bottomNav">

<div
onclick="scrollTopSmooth()"
style="
cursor:pointer;
color:#0042FD;
font-size:14px;
">
Back To Top
</div>

<div id="pagination"></div>

</div>

</div>
</div>

<!-- REDIRECT -->

<div id="redirectOverlay">

<div class="redirectBox">

<div class="spinner"></div>

<div style="font-size:14px;">
Redirecting to booking partner...
</div>

</div>

</div>

<script>

/* GOOGLE SHEET CSV */

const SHEET_URL="YOUR CSV URL HERE";

/* SETTINGS */

const MAX_ITEMS=20;
const ITEMS_PER_PAGE=12;

/* DATA */

let data=[];
let activeFilters=[];
let currentPage=1;
let currentCurrency="MYR";

let exchangeRates={
MYR:1
};

/* LOAD EXCHANGE RATES */

async function loadRates(){

try{

const res=await fetch(
"https://api.exchangerate.host/latest?base=MYR"
);

const json=await res.json();

exchangeRates={
MYR:1,
USD:json.rates.USD,
SGD:json.rates.SGD,
GBP:json.rates.GBP,
EUR:json.rates.EUR,
JPY:json.rates.JPY,
SAR:json.rates.SAR,
AED:json.rates.AED,
IDR:json.rates.IDR,
TRY:json.rates.TRY
};

}catch(err){

exchangeRates={
MYR:1,
USD:0.21,
SGD:0.30,
GBP:0.16,
EUR:0.19,
JPY:30
};

}

}

/* FORMAT PRICE */

function formatPrice(price){

let num=parseFloat(price)||0;

let converted=num*exchangeRates[currentCurrency];

return converted.toFixed(2);

}

/* CURRENCY */

function setCurrency(currency){

currentCurrency=currency;

render();

}

/* CSV PARSER */

function parseCSV(text){

const rows=text.trim().split("\n");

const headers=rows[0].split(",");

return rows.slice(1).map(row=>{

const cols=row.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g);

let obj={};

headers.forEach((h,i)=>{

obj[h.trim()]=cols?.[i]?.replaceAll('"',"")||"";

});

return obj;

});

}

/* LOAD DATA */

async function load(){

await loadRates();

const res=await fetch(SHEET_URL);

const text=await res.text();

data=parseCSV(text);

buildFilters();

render();

}

/* BUILD FILTERS */

function buildFilters(){

const groups={};

data.forEach(item=>{

(item.filter_tags||"")
.split(",")
.forEach(tag=>{

if(tag.toLowerCase().includes("view:"))
return;

let [cat,val]=tag.split(":");

if(!cat||!val)return;

if(!groups[cat])
groups[cat]=new Set();

groups[cat].add(val.trim());

});

});

const order=[
"Property Type",
"Meals",
"Facilities",
"Transport",
"Retail",
"Leisure",
"Convenience",
"Female Only"
];

const container=document.getElementById("filters");

order.forEach(cat=>{

if(!groups[cat])return;

let block=document.createElement("div");

block.innerHTML=`
<div class="filterTitle">${cat}</div>
`;

groups[cat].forEach(val=>{

let el=document.createElement("div");

el.className="tag";

el.innerText=val;

el.onclick=()=>toggle(cat+":"+val,el);

block.appendChild(el);

});

container.appendChild(block);

});

}

/* FILTER TOGGLE */

function toggle(tag,el){

if(activeFilters.includes(tag)){

activeFilters=activeFilters.filter(t=>t!==tag);

el.classList.remove("active");

}else{

activeFilters.push(tag);

el.classList.add("active");

}

currentPage=1;

render();

}

/* CLEAR */

function clearAll(){

activeFilters=[];

currentPage=1;

document
.querySelectorAll(".tag")
.forEach(t=>t.classList.remove("active"));

document.getElementById("searchInput").value="";

document.getElementById("sortSelect").value="default";

render();

}

/* SCROLL */

function scrollTopSmooth(){

window.scrollTo({
top:0,
behavior:"smooth"
});

}

/* REDIRECT */

function redirectBooking(url){

document.getElementById("redirectOverlay")
.style.display="flex";

setTimeout(()=>{

window.open(url,"_blank");

document.getElementById("redirectOverlay")
.style.display="none";

},900);

}

/* RENDER */

function render(){

const search=document
.getElementById("searchInput")
.value
.toLowerCase();

let filtered=data.filter(item=>{

let tags=(item.filter_tags||"")
.toLowerCase();

let isBasic=tags.includes("view: basic");

let matchFilters=activeFilters.every(f=>
tags.includes(f.toLowerCase())
);

let searchMatch=
(item.name||"")
.toLowerCase()
.includes(search)

||

(item.description||"")
.toLowerCase()
.includes(search);

return isBasic &&
matchFilters &&
searchMatch;

});

/* SORT */

const sort=document
.getElementById("sortSelect")
.value;

if(sort==="lowHigh"){

filtered.sort((a,b)=>
(parseFloat(a.price)||0)
-
(parseFloat(b.price)||0)
);

}

if(sort==="highLow"){

filtered.sort((a,b)=>
(parseFloat(b.price)||0)
-
(parseFloat(a.price)||0)
);

}

/* NO RESULTS */

document.getElementById("noResults")
.style.display=
filtered.length===0
?
"block"
:
"none";

/* LIMIT */

filtered=filtered.slice(0,MAX_ITEMS);

/* PAGINATION */

const start=
(currentPage-1)*ITEMS_PER_PAGE;

const pageData=
filtered.slice(start,start+ITEMS_PER_PAGE);

/* CARDS */

const cards=document.getElementById("cards");

cards.innerHTML=pageData.map(item=>{

const folder=(item.media||"").trim();

let mediaContent="";

if(folder){

for(let i=1;i<=10;i++){

mediaContent+=`

<img
src="https://salamguest.github.io/salamguest-directory/images/${folder}/${i}.jpg"
onerror="this.style.display='none'"
onload="this.dataset.loaded='true'"
>

`;

}

}else{

mediaContent=`

<img
src="https://salamguest.github.io/salamguest-directory/images/placeholder.jpg"
>

`;

}

return `

<div class="card">

<div class="carouselWrap">

<div class="carousel">
${mediaContent}
</div>

<div class="carouselIndicators"></div>

</div>

<div class="cardBody">

<div class="title">
${item.name}
</div>

<div class="location">
${item.city}, ${item.country}
</div>

<div class="description">
${item.description}
</div>

<div class="bottom">

<div class="priceWrap">

<div class="priceLabel">
EST FROM
</div>

<div class="priceAmount">
${formatPrice(item.price)}
</div>

<div class="priceCurrency">
${currentCurrency} / night
</div>

</div>

<div class="rating">
${item.rating} / 5

<div class="ratingSmall">
Average Rating
</div>

</div>

<div class="tagsRow">

${(item.card_tags||"")
.split(",")
.filter(tag=>tag.trim()!=="")
.map(tag=>`

<span class="cardTag">
${tag}
</span>

`)
.join("")}

</div>

<a
class="book"
href="javascript:void(0)"
onclick="redirectBooking('${item.link}')"
>
BOOK
</a>

<div class="relatedLinks">

${(item.quick_links||"")
.split(",")
.map(link=>{

const parts=link.split("|");

if(parts.length<2)return "";

return `
<a href="${parts[1]}">
${parts[0]}
</a>
`;

}).join("")}

</div>

</div>
</div>
</div>

`;

}).join("");

/* CAROUSEL LINES */

setTimeout(()=>{

document
.querySelectorAll(".carouselWrap")
.forEach(wrap=>{

const carousel=
wrap.querySelector(".carousel");

const indicators=
wrap.querySelector(".carouselIndicators");

const items=[
...carousel.children
].filter(img=>
img.dataset.loaded==="true"
).length;

if(items<=1)return;

indicators.innerHTML="";

for(let i=0;i<items;i++){

const dot=document.createElement("span");

if(i===0)
dot.classList.add("active");

indicators.appendChild(dot);

}

carousel.addEventListener("scroll",()=>{

const index=Math.round(
carousel.scrollLeft/
carousel.offsetWidth
);

indicators
.querySelectorAll("span")
.forEach((d,i)=>{

d.classList.toggle(
"active",
i===index
);

});

});

});

},300);

renderPagination(filtered.length);

}

/* PAGINATION */

function renderPagination(total){

const pages=Math.ceil(
total/ITEMS_PER_PAGE
);

let html="";

for(let i=1;i<=pages;i++){

html+=`

<button
class="pageBtn ${i===currentPage?'active':''}"
onclick="goPage(${i})"
>

${i}

</button>

`;

}

document.getElementById("pagination")
.innerHTML=html;

}

function goPage(p){

currentPage=p;

render();

}

/* ENTER SEARCH */

document
.getElementById("searchInput")
.addEventListener("keydown",e=>{

if(e.key==="Enter"){
render();
}

});

load();

</script>

</body>
</html>
