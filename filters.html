<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SalamGuest Directory</title>

<link href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:wght@700&family=Lexend:wght@400;500&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Lexend,sans-serif;
background:#fff;
color:#222;
}

.container{
display:flex;
gap:20px;
padding:20px;
max-width:1400px;
margin:auto;
}

.sidebar{
width:260px;
}

.filterTitle{
font-size:14px;
margin:18px 0 8px;
font-weight:500;
}

.tag{
display:inline-flex;
padding:8px 12px;
margin:4px;
background:#f2f2f2;
border-radius:999px;
font-size:13px;
cursor:pointer;
}

.tag.active{
background:#0042FD;
color:#fff;
}

.main{
flex:1;
}

/* SEARCH */

.search input{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid #ddd;
}

/* TOP BUTTONS */

.topButtons{
display:flex;
gap:10px;
margin-top:10px;
flex-wrap:wrap;
}

.clearBtn,
.sortSelect,
.currencyTopBtn{
padding:8px 12px;
border-radius:999px;
border:1px solid #ddd;
background:#fff;
cursor:pointer;
}

/* GRID */

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
margin-top:20px;
}

.card{
background:#fff;
border-radius:14px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
overflow:hidden;
display:flex;
flex-direction:column;
}

/* CAROUSEL */

.carouselWrap{
position:relative;
background:#f5f5f5;
min-height:220px;
}

.carousel img{
width:100%;
height:220px;
object-fit:cover;
}

/* AI LABEL */

.aiLabel{
position:absolute;
top:10px;
right:10px;
font-size:9px;
background:rgba(255,255,255,0.8);
padding:4px 8px;
border-radius:999px;
}

/* CARD BODY */

.cardBody{
padding:14px;
}

.title{
font-family:"Libre Bodoni",serif;
font-size:20px;
}

.location{
font-size:13px;
color:#666;
}

.priceAmount{
font-size:20px;
margin-top:10px;
}

/* TAGS */

.cardTag{
display:inline-block;
font-size:11px;
background:#eef3ff;
color:#0042FD;
padding:6px 10px;
border-radius:999px;
margin:4px 4px 0 0;
}

/* BOOK */

.book{
display:block;
margin-top:12px;
padding:10px;
text-align:center;
background:#0042FD;
color:#fff;
border-radius:999px;
text-decoration:none;
}

/* COMING SOON FILTERS */

.comingSoon{
margin-top:15px;
padding:10px;
font-size:12px;
background:#f7f7f7;
border-radius:10px;
color:#666;
}

</style>
</head>

<body>

<div class="container">

<div class="sidebar">

<div id="filters"></div>

<div class="comingSoon">
Advanced Filters — Coming Soon
</div>

</div>

<div class="main">

<div class="search">
<input id="searchInput" placeholder="Search hotel, stay or keyword">
</div>

<div class="topButtons">

<button class="clearBtn" onclick="clearAll()">Clear</button>

<select id="sortSelect" class="sortSelect" onchange="render()">
<option value="default">Sort</option>
<option value="lowHigh">Price Low → High</option>
<option value="highLow">Price High → Low</option>
<option value="ratingHigh">Highest Rated</option>
</select>

<button class="currencyTopBtn" onclick="toggleCurrencyMenu()">MYR</button>

</div>

<div class="grid" id="cards"></div>

</div>
</div>

<script>

const SHEET_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSYw1Ah01StvD_FKZvGw7M_pxB8_mxLhYDwE9rT7PEmK5n7VS7mxIi0FQZ1BezpycxRhOaXzrpwyRHU/pub?gid=0&output=csv";

let data=[];
let activeFilters=[];
let currentCurrency="MYR";

async function load(){

const res=await fetch(SHEET_URL);
const text=await res.text();

data=parseCSV(text);
buildFilters();
render();

}

function parseCSV(text){

const rows=text.trim().split("\n");
const headers=rows[0].split(",");

return rows.slice(1).map(row=>{
const cols=row.split(",");
let obj={};

headers.forEach((h,i)=>{
obj[h.trim()]=cols[i] || "";
});

return obj;

});

}

/* FILTERS */

function buildFilters(){

const container=document.getElementById("filters");
const groups={};

data.forEach(item=>{

(item.filter_tags||"").split(",").forEach(tag=>{

let [cat,val]=tag.split(":");
if(!cat||!val)return;

if(!groups[cat])groups[cat]=new Set();
groups[cat].add(val);

});

});

Object.keys(groups).forEach(cat=>{

let block=document.createElement("div");
block.innerHTML=`<div class="filterTitle">${cat}</div>`;

groups[cat].forEach(val=>{

let el=document.createElement("div");
el.className="tag";
el.innerText=val;

el.onclick=()=>{
toggle(cat+":"+val,el);
};

block.appendChild(el);

});

container.appendChild(block);

});

}

/* TOGGLE */

function toggle(tag,el){

if(activeFilters.includes(tag)){
activeFilters=activeFilters.filter(t=>t!==tag);
el.classList.remove("active");
}else{
activeFilters.push(tag);
el.classList.add("active");
}

render();

}

/* CLEAR */

function clearAll(){
activeFilters=[];
document.querySelectorAll(".tag").forEach(t=>t.classList.remove("active"));
document.getElementById("searchInput").value="";
render();
}

/* RENDER */

function render(){

const search=document.getElementById("searchInput").value.toLowerCase();

let filtered=data.filter(item=>{

let text=(
item.name+
item.city+
item.country+
item.description
).toLowerCase();

return text.includes(search);

});

const cards=document.getElementById("cards");

cards.innerHTML=filtered.map(item=>{

const folder=item.media||"";

let media="";

if(folder){

for(let i=1;i<=10;i++){

media+=`
<img
src="https://salamguest.github.io/salamguest-directory/images/${folder}/${i}.jpg"
onerror="this.style.display='none'"
>
`;

}

}else{

media=`
<img src="https://salamguest.github.io/salamguest-directory/images/placeholder.jpg">
`;

}

return `
<div class="card">

<div class="carouselWrap">

${item.image_label?.trim() ? `<div class="aiLabel">${item.image_label}</div>` : ""}

<div class="carousel">
${media}
</div>

</div>

<div class="cardBody">

<div class="title">${item.name}</div>
<div class="location">${item.city}, ${item.country}</div>

<div class="priceAmount">${item.price}</div>

<div>
${(item.card_tags||"").split(",").map(t=>`
<span class="cardTag">${t}</span>
`).join("")}
</div>

<a class="book" href="${item.link}" target="_blank">BOOK</a>

</div>

</div>
`;

}).join("");

}

load();

</script>

</body>
</html>
