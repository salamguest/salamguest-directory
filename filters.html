<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SalamGuest Directory</title>

<link href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:wght@600&family=Lexend:wght@300;400;500&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:'Lexend',sans-serif;
background:#f6f6f6;
}

.container{
display:flex;
}

/* SIDEBAR */

.sidebar{
width:260px;
background:white;
padding:20px;
border-right:1px solid #eee;
}

.filterTitle{
font-weight:600;
margin-bottom:10px;
}

.tag{
display:block;
padding:6px 10px;
margin:4px 0;
border:1px solid #ccc;
border-radius:20px;
cursor:pointer;
font-size:14px;
}

.tag.active{
background:#0042FD;
color:white;
border-color:#0042FD;
}

/* MAIN */

.main{
flex:1;
padding:20px;
}

.search{
margin-bottom:20px;
}

.search input{
width:100%;
padding:10px;
border-radius:8px;
border:1px solid #ccc;
font-family:'Lexend';
}

/* GRID */

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
}

/* CARD */

.card{
background:white;
border-radius:10px;
overflow:hidden;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
display:flex;
flex-direction:column;
}

.carousel img{
width:100%;
height:180px;
object-fit:cover;
cursor:pointer;
}

.cardBody{
padding:14px;
display:flex;
flex-direction:column;
flex-grow:1;
}

.title{
font-family:'Libre Bodoni',serif;
font-size:20px;
margin-bottom:4px;
}

.location{
font-size:13px;
color:#777;
margin-bottom:8px;
}

.description{
font-size:13px;
color:#555;
line-height:1.4;
}

.bottom{
margin-top:auto;
}

.price{
font-family:'Libre Bodoni',serif;
font-size:18px;
margin-top:10px;
}

.rating{
margin-top:4px;
font-size:14px;
}

.ratingSmall{
font-size:10px;
color:#777;
}

.book{
display:block;
margin-top:8px;
padding:9px;
text-align:center;
background:#0042FD;
color:white;
text-decoration:none;
border-radius:20px;
transition:0.2s;
}

.book:hover{
background:#eee;
color:#0042FD;
border:1px solid #0042FD;
}

/* NAV */

.bottomNav{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:20px;
}

.pagination{
text-align:right;
}

.pageBtn{
padding:6px 10px;
margin:4px;
border:1px solid #0042FD;
background:white;
cursor:pointer;
}

.pageBtn.active{
background:#0042FD;
color:white;
}

.backTop{
font-size:13px;
cursor:pointer;
color:#0042FD;
}

/* LIGHTBOX */

.lightbox{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
display:none;
justify-content:center;
align-items:center;
z-index:999;
}

.lightbox img{
max-width:90%;
max-height:90%;
}

/* MOBILE */

@media(max-width:900px){

.container{
flex-direction:column;
}

.sidebar{
width:100%;
display:flex;
overflow-x:auto;
white-space:nowrap;
}

.tag{
display:inline-block;
margin-right:6px;
}

.grid{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<div class="container">

<div class="sidebar">

<div class="filterTitle">Filters</div>
<div id="filters"></div>

</div>

<div class="main">

<div class="search">
<input id="searchInput" placeholder="Search hotel">
</div>

<div class="grid" id="cards"></div>

<div class="bottomNav">

<div class="backTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">
Back To Top
</div>

<div class="pagination" id="pagination"></div>

</div>

</div>

</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
<img id="lightboxImg">
</div>

<script>

const SHEET_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSYw1Ah01StvD_FKZvGw7M_pxB8_mxLhYDwE9rT7PEmK5n7VS7mxIi0FQZ1BezpycxRhOaXzrpwyRHU/pub?gid=0&single=true&output=csv";

const MAX_ITEMS=20;
const ITEMS_PER_PAGE=12;

let data=[];
let activeFilters=[];
let currentPage=1;

function parseCSV(text){

const rows=text.trim().split("\n");
const headers=rows[0].split(",");

return rows.slice(1).map(row=>{

const cols=row.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g);

let obj={};

headers.forEach((h,i)=>{
obj[h.trim()]=cols?.[i]?.replaceAll('"',"") || "";
});

return obj;

});

}

async function loadData(){

const res=await fetch(SHEET_URL);
const text=await res.text();

data=parseCSV(text);

buildFilters();
render();

}

function buildFilters(){

const set=new Set();

data.forEach(item=>{
(item.filter_tags||"").split(",").forEach(tag=>{
if(tag)set.add(tag.trim());
});
});

const container=document.getElementById("filters");

set.forEach(tag=>{

const div=document.createElement("div");
div.className="tag";
div.innerText=tag;

div.onclick=()=>toggleFilter(tag,div);

container.appendChild(div);

});

}

function toggleFilter(tag,el){

if(activeFilters.includes(tag)){
activeFilters=activeFilters.filter(t=>t!==tag);
el.classList.remove("active");
}else{
activeFilters.push(tag);
el.classList.add("active");
}

currentPage=1;
render();

}

function openLightbox(src){

const lb=document.getElementById("lightbox");
const img=document.getElementById("lightboxImg");

img.src=src;
lb.style.display="flex";

}

function closeLightbox(){
document.getElementById("lightbox").style.display="none";
}

function render(){

const search=document.getElementById("searchInput").value.toLowerCase();

let filtered=data.filter(item=>{

const tags=(item.filter_tags||"").toLowerCase();

const matchFilter=activeFilters.every(f=>tags.includes(f.toLowerCase()));

const matchSearch=(item.name||"").toLowerCase().includes(search);

return matchFilter && matchSearch;

});

filtered=filtered.slice(0,MAX_ITEMS);

const start=(currentPage-1)*ITEMS_PER_PAGE;
const pageData=filtered.slice(start,start+ITEMS_PER_PAGE);

const cards=document.getElementById("cards");

cards.innerHTML=pageData.map(item=>{

const folder=item.image_folder || "";
const img=`/images/${folder}/1.jpg`;

return `

<div class="card">

<div class="carousel">

<img src="${img}" onerror="this.src='/images/placeholder.jpg'" onclick="openLightbox(this.src)">

</div>

<div class="cardBody">

<div class="title">${item.name||""}</div>

<div class="location">${item.city||""}, ${item.country||""}</div>

<div class="description">${item.description||""}</div>

<div class="bottom">

<div class="price">${item.price||""}</div>

<div class="rating">
${item.rating||""} / 5
<div class="ratingSmall">Average Rating</div>
</div>

<a class="book" href="${item.link||"#"}" target="_blank">BOOK</a>

</div>

</div>

</div>

`;

}).join("");

renderPagination(filtered.length);

}

function renderPagination(total){

const pages=Math.ceil(total/ITEMS_PER_PAGE);

let html="";

for(let i=1;i<=pages;i++){

html+=`<button class="pageBtn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;

}

document.getElementById("pagination").innerHTML=html;

}

function goPage(p){
currentPage=p;
render();
}

const searchInput=document.getElementById("searchInput");

searchInput.addEventListener("keydown",(e)=>{

if(e.key==="Enter"){
e.preventDefault();
currentPage=1;
render();
}

});

searchInput.addEventListener("input",()=>{
currentPage=1;
render();
});

loadData();

</script>

</body>
</html>
