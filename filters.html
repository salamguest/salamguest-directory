<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SalamGuest Directory</title>

<link href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:wght@700&family=Lexend:wght@400;500&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Lexend,sans-serif;
background:#fff;
color:#222;
}

.container{
display:flex;
gap:20px;
padding:20px;
}

/* SIDEBAR */

.sidebar{
width:260px;
flex-shrink:0;
}

.filterTitle{
font-size:14px;
font-weight:500;
margin-top:18px;
margin-bottom:8px;
}

.tag{
display:inline-flex;
align-items:center;
justify-content:center;
padding:8px 14px;
margin:4px 4px 0 0;
background:#f2f2f2;
border-radius:999px;
font-size:13px;
cursor:pointer;
transition:0.2s;
text-align:center;
}

.tag.active{
background:#0042FD;
color:#fff;
}

/* MAIN */

.main{
flex:1;
}

/* SEARCH */

.search{
position:relative;
}

.search input{
width:100%;
padding:14px 50px 14px 14px;
border-radius:14px;
border:1px solid #dbe4ff;
background:#eef3ff;
font-family:Lexend;
font-size:14px;
box-sizing:border-box;
box-shadow:
inset 0 2px 5px rgba(0,0,0,0.08);
outline:none;
}

.search input:focus{
border-color:#0042FD;
}

.searchIcon{
position:absolute;
right:16px;
top:50%;
transform:translateY(-50%);
font-size:18px;
color:#0042FD;
pointer-events:none;
}

/* TOP BUTTONS */

.topButtons{
margin-top:10px;
display:flex;
gap:10px;
flex-wrap:wrap;
align-items:center;
}

.clearBtn{
padding:8px 16px;
border-radius:999px;
border:2px solid #0042FD;
background:white;
color:#0042FD;
cursor:pointer;
font-family:Lexend;
}

/* SORT */

.sortSelect{
padding:8px 14px;
border-radius:999px;
border:1px solid #dbe4ff;
background:#eef3ff;
font-family:Lexend;
font-size:13px;
cursor:pointer;
outline:none;
text-align:center;
text-align-last:center;
color:#444;
}

/* CURRENCY */

.currencyTopBtn{
padding:8px 14px;
border-radius:999px;
border:1px solid #dbe4ff;
background:#eef3ff;
font-family:Lexend;
font-size:13px;
cursor:pointer;
color:#444;
}

/* GRID */

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:22px;
margin-top:20px;
}

/* CARD */

.card{
background:white;
border-radius:16px;
overflow:hidden;
box-shadow:0 3px 10px rgba(0,0,0,0.14);
display:flex;
flex-direction:column;
}

/* CAROUSEL */

.carouselWrap{
position:relative;
overflow:hidden;
}

.carousel{
display:flex;
overflow-x:auto;
scroll-snap-type:x mandatory;
scroll-behavior:smooth;
-ms-overflow-style:none;
scrollbar-width:none;
}

.carousel::-webkit-scrollbar{
display:none;
}

.carousel img{
width:100%;
height:220px;
object-fit:cover;
flex-shrink:0;
scroll-snap-align:start;
}

/* INDICATORS */

.carouselIndicators{
position:absolute;
bottom:10px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:5px;
z-index:2;
}

.carouselIndicators span{
width:16px;
height:3px;
border-radius:999px;
background:rgba(255,255,255,0.4);
transition:0.2s;
}

.carouselIndicators span.active{
background:white;
}

/* CARD BODY */

.cardBody{
padding:16px;
display:flex;
flex-direction:column;
flex-grow:1;
}

.title{
font-family:"Libre Bodoni",serif;
font-size:24px;
line-height:1.2;
margin-bottom:4px;
}

.location{
font-size:13px;
color:#666;
margin-bottom:2px;
}

.description{
font-size:13px;
line-height:1.6;
color:#444;
white-space:pre-line;
}

/* PRICE */

.priceWrap{
margin-top:14px;
}

.priceAmount{
font-family:"Libre Bodoni",serif;
font-size:26px;
line-height:1;
}

.priceCurrency{
margin-top:8px;
font-size:11px;
color:#666;
letter-spacing:0.3px;
cursor:pointer;
display:inline-block;
border-bottom:1px dotted #666;
width:fit-content;
}

/* RATING */

.rating{
margin-top:12px;
font-size:14px;
color:#0042FD;
}

.ratingSmall{
font-size:10px;
color:#777;
margin-top:2px;
}

/* TAGS */

.tagsRow{
display:flex;
flex-wrap:wrap;
gap:6px;
margin-top:12px;
}

.cardTag{
display:inline-flex;
align-items:center;
justify-content:center;
background:#eaf0ff;
color:#0042FD;
padding:8px 12px;
border-radius:999px;
font-size:11px;
line-height:1.2;
}

/* BOOK */

.book{
display:block;
margin-top:16px;
padding:12px;
text-align:center;
background:#0042FD;
color:white;
text-decoration:none;
border-radius:999px;
border:2px solid #0042FD;
transition:0.2s;
}

.book:hover{
background:#f5f5f5;
color:#0042FD;
}

/* RELATED LINKS */

.relatedLinks{
margin-top:12px;
font-size:11px;
line-height:1.8;
letter-spacing:0.4px;
}

.relatedLinks a{
color:#324a7d;
text-decoration:underline;
margin-right:10px;
}

.relatedLinks a:hover{
color:#0042FD;
}

/* BOTTOM */

.bottom{
margin-top:auto;
}

.bottomNav{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:24px;
}

.pageBtn{
padding:7px 12px;
margin:2px;
border:1px solid #0042FD;
background:white;
color:#0042FD;
cursor:pointer;
border-radius:8px;
}

.pageBtn.active{
background:#0042FD;
color:white;
}

/* NO RESULTS */

#noResults{
display:none;
text-align:center;
margin-top:40px;
font-size:14px;
color:#666;
}

/* CURRENCY MODAL */

.currencyOption{
padding:10px 12px;
cursor:pointer;
border-radius:8px;
font-size:13px;
}

.currencyOption:hover{
background:#eef3ff;
}

/* REDIRECT */

#redirectOverlay{
position:fixed;
inset:0;
background:rgba(0,0,0,0.45);
display:none;
align-items:center;
justify-content:center;
z-index:99999;
}

.redirectBox{
background:white;
padding:24px;
border-radius:18px;
text-align:center;
width:240px;
box-shadow:0 10px 40px rgba(0,0,0,0.15);
}

.spinner{
width:32px;
height:32px;
border:3px solid #ddd;
border-top-color:#0042FD;
border-radius:50%;
margin:0 auto 16px;
animation:spin 1s linear infinite;
}

@keyframes spin{
to{
transform:rotate(360deg);
}
}

/* MOBILE */

@media(max-width:900px){

.container{
flex-direction:column;
padding:12px;
}

.sidebar{
width:100%;
}

.grid{
grid-template-columns:1fr;
}

.topButtons{
flex-direction:column;
align-items:stretch;
}

.clearBtn,
.sortSelect,
.currencyTopBtn{
width:100%;
}

.sortSelect{
text-align:center;
text-align-last:center;
}

.currencyTopBtn{
text-align:center;
}

}

</style>

</head>

<body>

<div class="container">

<div class="sidebar" id="filters"></div>

<div class="main">

<!-- SEARCH -->

<div class="search">

<input
id="searchInput"
placeholder="Search hotel, stay or any keyword"
>

<div class="searchIcon">
⌕
</div>

</div>

<!-- TOP BUTTONS -->

<div class="topButtons">

<button class="clearBtn" onclick="clearAll()">
Clear
</button>

<select id="sortSelect" class="sortSelect" onchange="render()">
<option value="default">Sort ▼</option>
<option value="lowHigh">Price: Low to High</option>
<option value="highLow">Price: High to Low</option>
<option value="ratingHigh">Highest Rated</option>
<option value="ratingLow">Lowest Rated</option>
</select>

<button class="currencyTopBtn"
onclick="toggleCurrencyMenu()">
MYR ▼
</button>

</div>

<div id="noResults">
No results found. Please try a different keyword.
</div>

<div class="grid" id="cards"></div>

<div class="bottomNav">

<div onclick="scrollTopSmooth()" style="
cursor:pointer;
color:#0042FD;
font-size:14px;
">
Back To Top
</div>

<div id="pagination"></div>

</div>

</div>
</div>

<!-- CURRENCY MODAL -->

<div id="currencyModal" style="
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,0.45);
z-index:99999;
align-items:center;
justify-content:center;
">

<div style="
background:white;
padding:20px;
border-radius:18px;
width:240px;
">

<div style="
font-size:15px;
margin-bottom:14px;
font-weight:500;
">
Choose Currency
</div>

<div class="currencyOption" onclick="setCurrency('MYR')">MYR</div>
<div class="currencyOption" onclick="setCurrency('USD')">USD</div>
<div class="currencyOption" onclick="setCurrency('SGD')">SGD</div>
<div class="currencyOption" onclick="setCurrency('GBP')">GBP</div>
<div class="currencyOption" onclick="setCurrency('EUR')">EUR</div>
<div class="currencyOption" onclick="setCurrency('JPY')">JPY</div>
<div class="currencyOption" onclick="setCurrency('SAR')">SAR</div>
<div class="currencyOption" onclick="setCurrency('AED')">AED</div>
<div class="currencyOption" onclick="setCurrency('IDR')">IDR</div>
<div class="currencyOption" onclick="setCurrency('TRY')">TRY</div>

</div>

</div>

<!-- REDIRECT -->

<div id="redirectOverlay">

<div class="redirectBox">

<div class="spinner"></div>

<div style="font-size:14px;">
Redirecting to booking partner...
</div>

</div>

</div>

<script>

/* YES — HTML inside Google Sheets IS possible.

Example in description column:

Verified by SalamGuest
<a href='verification.html'>ⓘ</a>

BUT:

For security/simplicity,
better approach is:
- create separate column:
verification_link

Then render it safely in template.

Much easier long-term maintenance.
*/

</script>

</body>
</html>
