<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Salam Guest</title>

<link href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:wght@700;900&family=Lexend:wght@400;500&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:'Lexend',sans-serif;
background:#FDFDFD;
color:#333;
}

h1,h2,h3{
font-family:'Libre Bodoni',serif;
color:#0042FD;
font-weight:900;
}

.nav{
background:#0042FD;
color:white;
padding:18px 30px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-family:'Libre Bodoni';
font-weight:900;
font-size:24px;
}

.hero{
text-align:center;
padding:80px 20px;
}

.hero h1{
font-size:54px;
margin-bottom:10px;
}

.tagline{
font-size:18px;
color:#333;
}

.searchbar{
max-width:800px;
margin:40px auto;
display:flex;
}

.searchbar input{
flex:1;
padding:14px;
border-radius:30px 0 0 30px;
border:2px solid #0042FD;
font-size:16px;
}

.searchbar button{
padding:14px 24px;
border:none;
background:#0042FD;
color:white;
border-radius:0 30px 30px 0;
cursor:pointer;
}

.container{
display:flex;
gap:30px;
padding:40px;
}

.sidebar{
width:260px;
}

.filter-group{
margin-bottom:30px;
}

.filter-title{
font-family:'Libre Bodoni';
margin-bottom:10px;
}

.filter-tag{
display:inline-block;
padding:6px 10px;
border:1px solid #001A66;
background:#697CA5;
color:white;
border-radius:20px;
margin:4px;
cursor:pointer;
font-size:13px;
}

.filter-tag.active{
background:#0042FD;
}

.grid{
flex:1;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
gap:26px;
}

.card{
background:white;
border-radius:12px;
box-shadow:0 4px 14px rgba(0,0,0,0.08);
overflow:hidden;
}

.carousel{
position:relative;
height:200px;
background:#eee;
}

.carousel img{
width:100%;
height:200px;
object-fit:cover;
cursor:pointer;
}

.card-body{
padding:16px;
}

.card-title{
font-family:'Libre Bodoni';
font-size:20px;
margin-bottom:4px;
}

.price{
font-family:'Libre Bodoni';
color:#0042FD;
margin-top:6px;
}

.rating{
color:#0042FD;
margin-bottom:8px;
}

.card-tags{
margin-top:10px;
}

.card-tag{
display:inline-block;
border:1px solid #001A66;
background:#697CA5;
color:white;
border-radius:16px;
padding:4px 8px;
font-size:12px;
margin:2px;
}

.book{
margin-top:14px;
display:block;
background:#0042FD;
color:white;
text-align:center;
padding:12px;
border-radius:30px;
text-decoration:none;
letter-spacing:0.1em;
}

.lightbox{
position:fixed;
top:0;
left:0;
right:0;
bottom:0;
background:rgba(0,0,0,0.8);
display:none;
align-items:center;
justify-content:center;
}

.lightbox img{
max-width:90%;
max-height:80%;
}

@media(max-width:900px){

.container{
flex-direction:column;
}

.sidebar{
width:100%;
overflow-x:auto;
white-space:nowrap;
}

.filter-group{
display:inline-block;
margin-right:20px;
}

}

</style>
</head>

<body>

<div class="nav">
<div class="logo">⌂ SALAM, GUEST</div>
<a class="book" href="#">Book A Stay</a>
</div>

<section class="hero">

<h1>⌂ SALAM, GUEST</h1>
<div class="tagline">
Search Halal-Filters, For Muslim Rentals & Stays
</div>

<div class="searchbar">
<input id="searchInput" placeholder="Search city, hotel or keyword">
<button onclick="applyFilters()">🔍</button>
</div>

</section>

<div class="container">

<div class="sidebar" id="filters"></div>

<div class="grid" id="listings"></div>

</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
<img id="lightboxImg">
</div>

<script>

const HOME_SHEET="https://docs.google.com/spreadsheets/d/e/2PACX-1vSYw1Ah01StvD_FKZvGw7M_pxB8_mxLhYDwE9rT7PEmK5n7VS7mxIi0FQZ1BezpycxRhOaXzrpwyRHU/pub?gid=1375063654&single=true&output=csv";
const FILTER_SHEET="https://docs.google.com/spreadsheets/d/e/2PACX-1vSYw1Ah01StvD_FKZvGw7M_pxB8_mxLhYDwE9rT7PEmK5n7VS7mxIi0FQZ1BezpycxRhOaXzrpwyRHU/pub?gid=98977509&single=true&output=csv";
const LISTING_SHEET="https://docs.google.com/spreadsheets/d/e/2PACX-1vSYw1Ah01StvD_FKZvGw7M_pxB8_mxLhYDwE9rT7PEmK5n7VS7mxIi0FQZ1BezpycxRhOaXzrpwyRHU/pub?gid=0&single=true&output=csv";

let listings=[];
let activeFilters=[];

function parseCSV(text){
return text.split("\n").map(r=>r.split(","));
}

async function loadFilters(){

let res=await fetch(FILTER_SHEET);
let txt=await res.text();
let rows=parseCSV(txt);

let groups={};

rows.slice(1).forEach(r=>{
let g=r[0];
let label=r[1];

if(!groups[g])groups[g]=[];
groups[g].push(label);
});

let html="";

for(let g in groups){

html+=`<div class="filter-group">
<div class="filter-title">${g}</div>`;

groups[g].forEach(tag=>{
html+=`<div class="filter-tag" onclick="toggleFilter('${tag}',this)">
${tag}
</div>`;
});

html+="</div>";
}

document.getElementById("filters").innerHTML=html;

}

async function loadListings(){

let res=await fetch(LISTING_SHEET);
let txt=await res.text();
let rows=parseCSV(txt);

let headers=rows[0];

listings=rows.slice(1).map(r=>{
let obj={};
headers.forEach((h,i)=>obj[h]=r[i]);
return obj;
});

renderListings(listings);

}

function renderListings(data){

let html="";

data.forEach(l=>{

let imgs=l.images?l.images.split(";"):["https://via.placeholder.com/600x400?text=Replace+Image+URL"];

html+=`
<div class="card">

<div class="carousel">
<img src="${imgs[0]}" onclick="openLightbox('${imgs[0]}')">
</div>

<div class="card-body">

<div class="card-title">${l.name}</div>
<div>${l.city}, ${l.country}</div>

<div class="price">${l.price}</div>

<div class="rating">${l.rating} / 5</div>

<div>${l.description}</div>

<div class="card-tags">
${(l.card_tags||"").split(";").map(t=>`<span class="card-tag">${t}</span>`).join("")}
</div>

<a class="book" href="${l.link}" target="_blank">BOOK</a>

</div>
</div>
`;

});

document.getElementById("listings").innerHTML=html;

}

function toggleFilter(tag,el){

if(activeFilters.includes(tag)){
activeFilters=activeFilters.filter(f=>f!==tag);
el.classList.remove("active");
}else{
activeFilters.push(tag);
el.classList.add("active");
}

applyFilters();

}

function applyFilters(){

let search=document.getElementById("searchInput").value.toLowerCase();

let filtered=listings.filter(l=>{

let tagString=(l.filter_tags||"").toLowerCase();

let matchFilters=activeFilters.every(f=>tagString.includes(f.toLowerCase()));

let matchSearch=
l.name.toLowerCase().includes(search)||
l.city.toLowerCase().includes(search)||
l.description.toLowerCase().includes(search);

return matchFilters && matchSearch;

});

renderListings(filtered);

}

function openLightbox(src){

document.getElementById("lightbox").style.display="flex";
document.getElementById("lightboxImg").src=src;

}

function closeLightbox(){
document.getElementById("lightbox").style.display="none";
}

loadFilters();
loadListings();

</script>

</body>
</html>
