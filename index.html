<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SALAM, GUEST</title>

<link href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:wght@900&family=Lexend:wght@500&display=swap" rel="stylesheet">

<style>

body{
font-family:Lexend;
background:#FDFDFD;
margin:0;
color:#333333;
}

h1,h2,h3{
font-family:"Libre Bodoni";
color:#0042FD;
}

header{
background:#0042FD;
color:white;
padding:18px 30px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-family:"Libre Bodoni";
font-size:26px;
}

.cta{
border:2px solid #0042FD;
background:#F7F6F6;
padding:10px 18px;
border-radius:40px;
font-size:13px;
text-transform:uppercase;
letter-spacing:0.1em;
cursor:pointer;
}

.container{
display:flex;
max-width:1400px;
margin:auto;
padding:30px;
}

.sidebar{
width:260px;
padding-right:30px;
}

.filter-title{
font-family:"Libre Bodoni";
margin-bottom:8px;
}

.filter-group{
margin-bottom:25px;
}

.filter-group label{
display:block;
margin-bottom:6px;
cursor:pointer;
}

.grid{
flex:1;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:24px;
}

.card{
background:white;
box-shadow:0 2px 12px rgba(0,0,0,0.08);
border-radius:14px;
overflow:hidden;
display:flex;
flex-direction:column;
}

.card img{
width:100%;
height:180px;
object-fit:cover;
}

.card-body{
padding:16px;
}

.city{
color:#697CA5;
font-size:14px;
margin-bottom:8px;
}

.price{
font-family:"Libre Bodoni";
font-size:20px;
margin-bottom:6px;
}

.rating{
font-family:"Libre Bodoni";
color:#0042FD;
}

.rating small{
color:#333;
font-family:Lexend;
font-size:11px;
}

.tags{
margin-top:10px;
}

.tag{
display:inline-block;
border:1px solid #001A66;
background:#697CA5;
color:white;
padding:3px 8px;
font-size:11px;
border-radius:6px;
margin-right:4px;
margin-top:4px;
}

.book-btn{
margin-top:14px;
background:#0042FD;
color:white;
text-align:center;
padding:10px;
border-radius:40px;
font-size:12px;
letter-spacing:0.1em;
text-transform:uppercase;
cursor:pointer;
}

@media(max-width:900px){

.container{
flex-direction:column;
}

.sidebar{
width:100%;
display:flex;
overflow-x:auto;
gap:18px;
margin-bottom:20px;
}

.filter-group{
min-width:180px;
}

.grid{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<header>
<div class="logo">⌂ SALAM, GUEST</div>
<div class="cta">Book A Stay</div>
</header>

<div class="container">

<div class="sidebar">

<div class="filter-group">
<div class="filter-title">Category</div>
<label><input type="checkbox" value="hotel" class="filter"> Hotel</label>
<label><input type="checkbox" value="bnb" class="filter"> BnB</label>
<label><input type="checkbox" value="villa" class="filter"> Villa</label>
</div>

<div class="filter-group">
<div class="filter-title">Meals</div>
<label><input type="checkbox" value="halal-food" class="filter"> Halal Food</label>
<label><input type="checkbox" value="breakfast" class="filter"> Breakfast</label>
</div>

<div class="filter-group">
<div class="filter-title">Female Only</div>
<label><input type="checkbox" value="female-floor" class="filter"> Female Floor</label>
</div>

</div>

<div class="grid" id="grid"></div>

</div>

<script>

const SHEET_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSYw1Ah01StvD_FKZvGw7M_pxB8_mxLhYDwE9rT7PEmK5n7VS7mxIi0FQZ1BezpycxRhOaXzrpwyRHU/pub?gid=0&single=true&output=csv";

fetch(SHEET_URL)
.then(res=>res.text())
.then(data=>{

const rows=data.split("\n").slice(1);

const listings=rows.map(r=>{
const c=r.split(",");
return{
name:c[0],
city:c[1],
country:c[2],
category:c[3],
price:c[4],
rating:c[5],
description:c[6],
tags:c[7],
gallery:c[8]
}
});

render(listings);

document.querySelectorAll(".filter").forEach(f=>{
f.addEventListener("change",()=>{
applyFilters(listings);
});
});

});

function applyFilters(listings){

const active=[...document.querySelectorAll(".filter:checked")].map(f=>f.value);

if(active.length==0){
render(listings);
return;
}

const filtered=listings.filter(l=>{

if(!l.tags) return false;

return active.some(tag=>l.tags.includes(tag));

});

render(filtered);

}

function render(list){

const grid=document.getElementById("grid");
grid.innerHTML="";

list.forEach(l=>{

const img=`/salamguest-directory/images/${l.gallery}/1.jpg`;

const tags=l.tags?l.tags.split(";"):[];
let tagHTML="";

tags.forEach(t=>{
tagHTML+=`<span class="tag">${t}</span>`;
});

const card=`
<div class="card">

<img src="${img}" onerror="this.src='/salamguest-directory/images/placeholder.jpg'">

<div class="card-body">

<h3>${l.name}</h3>

<div class="city">${l.city}</div>

<div class="price">${l.price}</div>

<div class="rating">
${l.rating} / 5<br>
<small>Average Rating</small>
</div>

<p>${l.description}</p>

<div class="tags">${tagHTML}</div>

<div class="book-btn">BOOK</div>

</div>

</div>
`;

grid.innerHTML+=card;

});

}

</script>

</body>
</html>
