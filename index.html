<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SalamGuest Directory</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
background:#f6f6f6;
}

/* layout */

.container{
display:flex;
}

/* sidebar */

.sidebar{
width:260px;
background:white;
padding:20px;
border-right:1px solid #eee;
}

.filterTitle{
font-weight:bold;
margin-bottom:10px;
}

.tag{
display:block;
padding:6px 10px;
margin:4px 0;
border:1px solid #ccc;
border-radius:20px;
cursor:pointer;
font-size:14px;
}

.tag.active{
background:#0042FD;
color:white;
border-color:#0042FD;
}

/* main */

.main{
flex:1;
padding:20px;
}

/* search */

.search{
margin-bottom:20px;
}

.search input{
width:100%;
padding:10px;
border-radius:8px;
border:1px solid #ccc;
}

/* cards */

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
}

.card{
background:white;
border-radius:10px;
overflow:hidden;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.card img{
width:100%;
height:180px;
object-fit:cover;
}

.cardBody{
padding:12px;
}

.title{
font-weight:bold;
margin-bottom:4px;
}

.location{
font-size:13px;
color:#666;
}

.price{
font-weight:bold;
color:#0042FD;
}

.rating{
font-size:14px;
margin-top:6px;
}

.ratingSmall{
font-size:10px;
color:#777;
}

.book{
display:block;
margin-top:10px;
padding:8px;
text-align:center;
background:#0042FD;
color:white;
text-decoration:none;
border-radius:20px;
}

/* pagination */

.pagination{
margin-top:20px;
text-align:center;
}

.pageBtn{
padding:6px 10px;
margin:4px;
border:1px solid #0042FD;
background:white;
cursor:pointer;
}

.pageBtn.active{
background:#0042FD;
color:white;
}

/* mobile */

@media(max-width:900px){

.container{
flex-direction:column;
}

.sidebar{
width:100%;
display:flex;
overflow-x:auto;
white-space:nowrap;
}

.tag{
display:inline-block;
margin-right:6px;
}

.grid{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<div class="container">

<div class="sidebar">

<div class="filterTitle">Filters</div>

<div id="filters"></div>

</div>

<div class="main">

<div class="search">
<input id="searchInput" placeholder="Search hotel or location">
</div>

<div class="grid" id="cards"></div>

<div class="pagination" id="pagination"></div>

</div>

</div>

<script>

/* YOUR GOOGLE SHEET CSV */

const SHEET_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSYw1Ah01StvD_FKZvGw7M_pxB8_mxLhYDwE9rT7PEmK5n7VS7mxIi0FQZ1BezpycxRhOaXzrpwyRHU/pub?gid=0&single=true&output=csv";

/* settings */

const MAX_ITEMS=20;
const ITEMS_PER_PAGE=12;

let data=[];
let activeFilters=[];
let currentPage=1;

/* CSV parser */

function parseCSV(text){

const rows=text.trim().split("\n");
const headers=rows.shift().split(",");

return rows.map(row=>{
const cols=row.split(",");
let obj={};
headers.forEach((h,i)=>obj[h.trim()]=cols[i]);
return obj;
});

}

/* load data */

async function loadData(){

const res=await fetch(SHEET_URL);
const text=await res.text();

data=parseCSV(text);

buildFilters();
render();

}

/* build filters */

function buildFilters(){

const set=new Set();

data.forEach(item=>{

(item.filter_tags||"").split(",").forEach(tag=>{
if(tag)set.add(tag.trim());
});

});

const container=document.getElementById("filters");
container.innerHTML="";

set.forEach(tag=>{

const div=document.createElement("div");
div.className="tag";
div.innerText=tag;

div.onclick=()=>toggleFilter(tag,div);

container.appendChild(div);

});

}

/* toggle filter */

function toggleFilter(tag,el){

if(activeFilters.includes(tag)){
activeFilters=activeFilters.filter(t=>t!==tag);
el.classList.remove("active");
}else{
activeFilters.push(tag);
el.classList.add("active");
}

currentPage=1;
render();

}

/* render cards */

function render(){

const search=document.getElementById("searchInput").value.toLowerCase();

let filtered=data.filter(item=>{

const tags=(item.filter_tags||"").toLowerCase();

const matchFilter=activeFilters.every(f=>tags.includes(f.toLowerCase()));

const matchSearch=
(item.name||"").toLowerCase().includes(search) ||
(item.location||"").toLowerCase().includes(search);

return matchFilter && matchSearch;

});

/* limit to 20 */

filtered=filtered.slice(0,MAX_ITEMS);

const start=(currentPage-1)*ITEMS_PER_PAGE;
const pageData=filtered.slice(start,start+ITEMS_PER_PAGE);

const cards=document.getElementById("cards");

cards.innerHTML=pageData.map(item=>`

<div class="card">

<img src="/images/placeholder.jpg">

<div class="cardBody">

<div class="title">${item.name||""}</div>

<div class="location">${item.location||""}</div>

<div class="price">$${item.price||""}</div>

<div class="rating">
${item.rating||""} / 5
<div class="ratingSmall">Average Rating</div>
</div>

<a class="book" href="${item.link||"#"}" target="_blank">
BOOK
</a>

</div>

</div>

`).join("");

renderPagination(filtered.length);

}

/* pagination */

function renderPagination(total){

const pages=Math.ceil(total/ITEMS_PER_PAGE);

let html="";

for(let i=1;i<=pages;i++){

html+=`<button class="pageBtn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;

}

document.getElementById("pagination").innerHTML=html;

}

function goPage(p){
currentPage=p;
render();
}

/* search */

document.getElementById("searchInput").addEventListener("input",()=>{

currentPage=1;
render();

});

loadData();

</script>

</body>
</html>
