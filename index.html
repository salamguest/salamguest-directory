<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>Salam Guest</title>

<link href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:wght@700;900&family=Lexend:wght@400;500&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Lexend;
background:#FDFDFD;
color:#333333;
}

h1,h2,h3{
font-family:'Libre Bodoni';
color:#0042FD;
}

.nav{
background:#0042FD;
color:white;
padding:18px 30px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-family:'Libre Bodoni';
font-weight:900;
font-size:26px;
}

.hero{
text-align:center;
padding:70px 20px;
}

.hero h1{
font-size:52px;
margin-bottom:10px;
}

.tagline{
font-size:18px;
}

.searchbar{
max-width:700px;
margin:40px auto;
display:flex;
}

.searchbar input{
flex:1;
padding:14px;
border:2px solid #0042FD;
border-radius:30px 0 0 30px;
}

.searchbar button{
background:#0042FD;
color:white;
border:none;
padding:14px 22px;
border-radius:0 30px 30px 0;
cursor:pointer;
}

.container{
display:flex;
gap:40px;
padding:40px;
}

.sidebar{
width:250px;
}

.filter-title{
font-weight:bold;
margin:15px 0 8px;
}

.tag{
display:inline-block;
border:1px solid #001A66;
background:#697CA5;
color:white;
padding:6px 10px;
border-radius:20px;
margin:3px;
cursor:pointer;
font-size:13px;
}

.tag.active{
background:#0042FD;
}

.grid{
flex:1;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:25px;
}

.card{
background:white;
border-radius:12px;
box-shadow:0 4px 14px rgba(0,0,0,0.1);
overflow:hidden;
}

.card img{
width:100%;
height:200px;
object-fit:cover;
}

.card-body{
padding:16px;
}

.card-title{
font-family:'Libre Bodoni';
font-size:20px;
}

.price{
font-family:'Libre Bodoni';
color:#0042FD;
}

.rating{
font-family:'Libre Bodoni';
color:#0042FD;
}

.small{
font-size:11px;
color:#333333;
}

.card-tags{
margin-top:8px;
}

.card-tag{
background:#697CA5;
border:1px solid #001A66;
color:white;
border-radius:16px;
padding:4px 8px;
font-size:12px;
margin:2px;
}

.book{
display:block;
margin-top:12px;
background:#0042FD;
color:white;
text-align:center;
padding:12px;
border-radius:30px;
text-decoration:none;
letter-spacing:0.1em;
}

@media(max-width:900px){

.container{
flex-direction:column;
}

.sidebar{
width:100%;
overflow-x:auto;
white-space:nowrap;
}

.grid{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<div class="nav">

<div class="logo">⌂ SALAM, GUEST</div>

<a class="book" href="#">Book A Stay</a>

</div>

<section class="hero">

<h1>⌂ SALAM, GUEST</h1>

<div class="tagline">
Search Halal-Filters, For Muslim Rentals & Stays
</div>

<div class="searchbar">

<input id="search">

<button onclick="applyFilters()">🔍</button>

</div>

</section>

<div class="container">

<div class="sidebar" id="filters"></div>

<div class="grid" id="listings"></div>

</div>

<script>

const FILTER_SHEET="https://docs.google.com/spreadsheets/d/e/2PACX-1vSYw1Ah01StvD_FKZvGw7M_pxB8_mxLhYDwE9rT7PEmK5n7VS7mxIi0FQZ1BezpycxRhOaXzrpwyRHU/pub?gid=98977509&single=true&output=csv";

const LISTING_SHEET="https://docs.google.com/spreadsheets/d/e/2PACX-1vSYw1Ah01StvD_FKZvGw7M_pxB8_mxLhYDwE9rT7PEmK5n7VS7mxIi0FQZ1BezpycxRhOaXzrpwyRHU/pub?gid=0&single=true&output=csv";

let listings=[];
let active=[];

function parseCSV(text){

return text.split("\n").map(r=>r.split(","));

}

async function loadFilters(){

let r=await fetch(FILTER_SHEET);
let t=await r.text();

let rows=parseCSV(t);

let groups={};

rows.slice(1).forEach(x=>{

let g=x[0];
let label=x[1];

if(!groups[g])groups[g]=[];

groups[g].push(label);

});

let html="";

for(let g in groups){

html+=`<div class="filter-title">${g}</div>`;

groups[g].forEach(tag=>{

html+=`<div class="tag" onclick="toggleTag('${tag}',this)">${tag}</div>`;

});

}

filters.innerHTML=html;

}

async function loadListings(){

let r=await fetch(LISTING_SHEET);
let t=await r.text();

let rows=parseCSV(t);

let head=rows[0];

listings=rows.slice(1).map(r=>{

let o={};

head.forEach((h,i)=>o[h]=r[i]);

return o;

});

render(listings);

}

function render(data){

let html="";

data.forEach(l=>{

let imgs=l.images?l.images.split(";"):["/images/placeholder.jpg"];

html+=`

<div class="card">

<img src="/images/${imgs[0]}">

<div class="card-body">

<div class="card-title">${l.name}</div>

<div>${l.city}</div>

<div class="price">${l.price}</div>

<div class="rating">

${l.rating} / 5

<div class="small">Average Rating</div>

</div>

<div>${l.description}</div>

<div class="card-tags">

${(l.card_tags||"").split(";").map(t=>`<span class="card-tag">${t}</span>`).join("")}

</div>

<a class="book" href="${l.link}" target="_blank">BOOK</a>

</div>

</div>

`;

});

listingsDiv.innerHTML=html;

}

function toggleTag(tag,el){

if(active.includes(tag)){

active=active.filter(x=>x!==tag);
el.classList.remove("active");

}else{

active.push(tag);
el.classList.add("active");

}

applyFilters();

}

function applyFilters(){

let s=search.value.toLowerCase();

let filtered=listings.filter(l=>{

let tags=(l.filter_tags||"").toLowerCase();

let ok=active.every(a=>tags.includes(a.toLowerCase()));

let searchok=l.name.toLowerCase().includes(s)||l.city.toLowerCase().includes(s);

return ok&&searchok;

});

render(filtered);

}

loadFilters();

loadListings();

</script>

</body>
</html>
