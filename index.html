
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Salam Guest</title>

<link href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:wght@700;900&family=Lexend:wght@400;500&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Lexend;
background:#FDFDFD;
color:#333;
}

h1,h2,h3{
font-family:'Libre Bodoni';
color:#0042FD;
}

.nav{
background:#0042FD;
color:white;
padding:16px 24px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-family:'Libre Bodoni';
font-weight:900;
font-size:24px;
}

.hero{
text-align:center;
padding:60px 20px;
}

.hero h1{
font-size:52px;
margin:0;
}

.tagline{
margin-top:10px;
}

.searchbar{
max-width:700px;
margin:30px auto;
display:flex;
}

.searchbar input{
flex:1;
padding:14px;
border:2px solid #0042FD;
border-radius:30px 0 0 30px;
}

.searchbar button{
background:#0042FD;
color:white;
border:none;
padding:14px 20px;
border-radius:0 30px 30px 0;
cursor:pointer;
}

/* LAYOUT */
.wrapper{
display:flex;
gap:30px;
padding:30px;
}

/* SIDEBAR FILTERS */
.sidebar{
width:260px;
}

.filter-title{
font-weight:bold;
margin:15px 0 8px;
font-family:'Libre Bodoni';
}

.tag{
display:inline-block;
padding:6px 10px;
border-radius:20px;
background:#697CA5;
color:white;
border:1px solid #001A66;
margin:4px;
cursor:pointer;
font-size:13px;
}

.tag.active{
background:#0042FD;
}

/* GRID - 3 columns */
.grid{
flex:1;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:22px;
}

/* CARD */
.card{
background:white;
border-radius:12px;
box-shadow:0 4px 14px rgba(0,0,0,0.08);
overflow:hidden;
display:flex;
flex-direction:column;
}

.card img{
width:100%;
height:190px;
object-fit:cover;
}

.card-body{
padding:14px;
}

.title{
font-family:'Libre Bodoni';
font-size:20px;
}

.price{
color:#0042FD;
font-family:'Libre Bodoni';
margin-top:4px;
}

.rating{
font-family:'Libre Bodoni';
color:#0042FD;
}

.small{
font-size:11px;
color:#666;
}

.tags{
margin-top:8px;
}

.tag-pill{
background:#697CA5;
border:1px solid #001A66;
color:white;
padding:4px 8px;
border-radius:16px;
font-size:12px;
margin:2px;
display:inline-block;
}

.book{
margin-top:auto;
background:#0042FD;
color:white;
text-align:center;
padding:12px;
text-decoration:none;
letter-spacing:0.1em;
}

/* PAGINATION */
.pagination{
text-align:center;
padding:20px;
}

.page-btn{
background:#fff;
border:2px solid #0042FD;
color:#0042FD;
padding:8px 12px;
margin:3px;
border-radius:8px;
cursor:pointer;
}

.page-btn.active{
background:#0042FD;
color:#fff;
}

/* MOBILE */
@media(max-width:900px){

.wrapper{
flex-direction:column;
}

.sidebar{
width:100%;
overflow-x:auto;
white-space:nowrap;
}

.grid{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<div class="nav">
<div class="logo">⌂ SALAM, GUEST</div>
</div>

<div class="hero">
<h1>⌂ SALAM, GUEST</h1>
<div class="tagline">Search Halal-Filters, For Muslim Rentals & Stays</div>
</div>

<div class="searchbar">
<input id="search" placeholder="Search hotels...">
<button onclick="apply()">🔍</button>
</div>

<div class="wrapper">

<div class="sidebar" id="filters"></div>

<div style="flex:1">

<div class="grid" id="grid"></div>

<div class="pagination" id="pagination"></div>

</div>

</div>

<script>

/* SHEETS */
const LISTING="https://docs.google.com/spreadsheets/d/e/2PACX-1vSYw1Ah01StvD_FKZvGw7M_pxB8_mxLhYDwE9rT7PEmK5n7VS7mxIi0FQZ1BezpycxRhOaXzrpwyRHU/pub?gid=0&single=true&output=csv";
const FILTERS="https://docs.google.com/spreadsheets/d/e/2PACX-1vSYw1Ah01StvD_FKZvGw7M_pxB8_mxLhYDwE9rT7PEmK5n7VS7mxIi0FQZ1BezpycxRhOaXzrpwyRHU/pub?gid=98977509&single=true&output=csv";

let data=[];
let active=[];
let page=1;
const perPage=12;

function csv(t){
return t.split("\n").map(r=>r.split(","));
}

/* LOAD LISTINGS */
async function load(){

let r=await fetch(LISTING);
let t=await r.text();

let rows=csv(t);
let h=rows[0];

data=rows.slice(1).map(r=>{
let o={};
h.forEach((x,i)=>o[x]=r[i]);
return o;
});

renderFilters();
render();

}

/* FILTERS */
async function renderFilters(){

let r=await fetch(FILTERS);
let t=await r.text();

let rows=csv(t);

let groups={};

rows.slice(1).forEach(r=>{
let g=r[0];
let l=r[1];
if(!groups[g])groups[g]=[];
groups[g].push(l);
});

let html="";

for(let g in groups){

html+=`<div class="filter-title">${g}</div>`;

groups[g].forEach(t=>{
html+=`<div class="tag" onclick="toggle('${t}',this)">${t}</div>`;
});

}

filters.innerHTML=html;

}

/* FILTER TOGGLE */
function toggle(t,el){

if(active.includes(t)){
active=active.filter(x=>x!==t);
el.classList.remove("active");
}else{
active.push(t);
el.classList.add("active");
}

page=1;
render();

}

/* APPLY */
function apply(){
page=1;
render();
}

/* RENDER */
function render(){

let s=document.getElementById("search").value.toLowerCase();

let filtered=data.filter(d=>{

let tags=(d.filter_tags||"").toLowerCase();

let ok=active.every(a=>tags.includes(a.toLowerCase()));

let searchok=
(d.name||"").toLowerCase().includes(s) ||
(d.city||"").toLowerCase().includes(s);

return ok && searchok;

});

/* PAGINATION */
let start=(page-1)*perPage;
let end=start+perPage;
let pageData=filtered.slice(start,end);

grid.innerHTML=pageData.map(d=>`

<div class="card">

<img src="/images/${(d.images||"placeholder.jpg").split(";")[0]}">

<div class="card-body">

<div class="title">${d.name}</div>

<div>${d.city}</div>

<div class="price">${d.price}</div>

<div class="rating">
${d.rating} / 5
<div class="small">Average Rating</div>
</div>

<div>${d.description}</div>

<div class="tags">
${(d.card_tags||"").split(";").map(t=>`<span class="tag-pill">${t}</span>`).join("")}
</div>

<a class="book" href="${d.link}" target="_blank">BOOK</a>

</div>

</div>

`).join("");

renderPages(filtered.length);

}

/* PAGINATION UI */
function renderPages(total){

let pages=Math.ceil(total/perPage);

let html="";

for(let i=1;i<=pages;i++){

html+=`
<button class="page-btn ${i===page?'active':''}" onclick="go(${i})">${i}</button>
`;

}

pagination.innerHTML=html;

}

function go(p){
page=p;
render();
}

load();

</script>

</body>
</html>
