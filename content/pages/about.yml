body: >-
  About SalamGuest


  SalamGuest is a directory designed to help travellers discover Muslim-friendly
  accommodation and useful travel facilities around the world.


  Our goal is to make it easier to find relevant information, explore travel
  options and plan journeys with greater confidence.
