title: Welcome to SalamGuest
slug: home
description: Discover Muslim-friendly stays, travel essentials and thoughtful
  travel resources around the world.
body: >-
  Welcome to SalamGuest


  Your guide to discovering Muslim-friendly accommodation and travel essentials
  around the world.


  Explore destinations, discover useful facilities and find stays that better
  suit your needs.
homepage_design:
  hero:
    heading: SALAM, GUEST
    subheading: |-
      Search Halal-Filters,
      For Muslim friendly Stays
    subheading_uppercase: false
    subheading_font_size: 100px
    heading_line_height: "1.7"
    subheading_line_height: "1.9"
    content_padding_top: "20"
    content_padding_bottom: "20"
    button_label: Explore Filters
  slider:
    enabled: true
    autoplay: true
    subheading_uppercase: false
    subheading_font_size: 24px
    text_padding_top: 20px
  faq:
    default_open: false
    items:
      - question: What is Salam Guest?
        answer: SalamGuest is a halal-friendly travel directory that helps you find
          places to stay and eat with Muslim needs in mind. Our listings
          highlight amenities such as halal food, prayer facilities, bidet
          availability, and more.
      - question: How do the filters work?
        answer: Each listing is tagged based on its available amenities. You can use the
          filters to quickly find options that fit your preferences — from halal
          breakfast to privacy-friendly rooms.
seo:
  title: SalamGuest | Muslim-Friendly Travel Directory
  description: SalamGuest helps Muslim guests and travellers discover stays and
    experiences with useful comfort and convenience information.
