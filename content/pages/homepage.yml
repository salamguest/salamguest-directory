title: Welcome to SalamGuest
slug: home
description: Discover Muslim-friendly stays, travel essentials and thoughtful
  travel resources around the world.
body: >-
  Welcome to SalamGuest


  Your guide to discovering Muslim-friendly accommodation and travel essentials
  around the world.


  Explore destinations, discover useful facilities and find stays & experiences
  that better suit your lifestyle needs. 
homepage_design:
  hero:
    heading: SALAM, GUEST
    subheading: |-
      Search Halal-Filters,
      For Muslim friendly Stays
    subheading_uppercase: false
    subheading_font_size: 100px
    heading_line_height: "3"
    subheading_line_height: 2.5rem
    content_padding_top: "20"
    content_padding_bottom: "20"
    button_label: EXPLORE FILTERS
    content_width: small
    content_height: tall
  slider:
    enabled: true
    autoplay: true
    subheading_uppercase: false
    subheading_font_size: 24px
    text_padding_top: 20px
    slides:
      - subheading_uppercase: false
  features:
    layout: centred
  faq:
    heading: FAQs
    default_open: false
    view_all_label: VIEW FULL FAQ
    items:
      - question: What is SalamGuest?
        answer: SalamGuest is a halal-friendly travel directory that helps you find
          places to stay and eat with Muslim needs in mind. Our listings
          highlight amenities such as halal food, prayer facilities, bidet
          availability, and more.
      - question: How do the filters work?
        answer: Each listing is tagged based on its available amenities. You can use the
          filters to quickly find options that fit your preferences — from halal
          breakfast to privacy-friendly rooms.
      - question: "Are all listings verified? "
        answer: Some listings carry the “Verified by SalamGuest” label. This means our
          team has reviewed the information for accuracy. Listings without this
          label may still be suitable, but rely on public details or
          host-provided information.
      - question: Do i need an account to use SalamGuest?
        answer: You can browse and search our listings using basic filters without
          signing up. We are currently developing access to full listings and
          advanced filters. Once available, you will be able to subscribe
          through a 2-month pass or monthly plan.
      - question: "How do I suggest a new listing? "
        answer: If you know a halal-friendly hotel or stay, you can suggest it through
          our contact page. Our team will review it for inclusion.
  filter_section:
    enabled: false
seo:
  title: SalamGuest | Halal Filters For Muslim Friendly Travel & Experiences
  description: SalamGuest helps Muslim guests and travellers discover stays and
    experiences with useful comfort and convenience information.
